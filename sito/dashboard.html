<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Mappa Veicoli</title>
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; font-size: 20px; }
        .nav-menu { display: flex; gap: 15px; }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-weight: 500; font-size: 15px; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .nav-btn:hover, .nav-btn.active { color: var(--primary-orange); background: rgba(255,87,34,0.05); }
        
        .main-workspace { flex: 1; display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 65px); }
        .sidebar-fleet { background: var(--surface-card); border: 1px solid var(--border-color); padding: 25px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .fleet-title { font-size: 18px; font-weight: 600; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .filter-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        .filter-group label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        .filter-select { background: #121212; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; color: white; font-size: 14px; width: 100%; outline: none; }
        .filter-select:focus { border-color: var(--primary-orange); }

        .vehicle-box { background: #121212; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; cursor: pointer; margin-bottom: 15px; transition: border-color 0.3s; }
        .vehicle-box:hover { border-color: var(--primary-orange); }
        .vehicle-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .battery-level { color: #4CAF50; font-weight: bold; font-size: 13px; }
        
        .map-wrapper { width: 100%; height: 100%; background: #222; }
        .map-iframe { width: 100%; height: 100%; border: none; filter: grayscale(1) invert(1) contrast(1.2); }
        .btn-rent { background: var(--primary-orange); color: white; border: none; padding: 10px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%; margin-top: 12px; transition: background 0.2s; display: block; text-align: center; }
        .btn-rent:hover { background-color: #E64A19; }
        .no-vehicles { color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-brand" onclick="window.location.replace('dashboard.html')">
            <svg width="35" height="35" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5 C15 35 15 75 50 95 C85 75 85 35 50 5 Z" fill="#FF5722"/>
                <polygon points="52,15 35,52 48,52 44,82 65,42 50,42" fill="#FFFFFF"/>
            </svg>
            <span>IZALITH</span>
        </div>
        <div class="nav-menu">
            <button class="nav-btn active" onclick="window.location.replace('dashboard.html')">Esplora Mappa</button>
            <button class="nav-btn" onclick="window.location.replace('wallet.html')">Il Mio Wallet</button>
            <button class="nav-btn" onclick="window.location.replace('noleggio-attivo.html')">Noleggio Attivo</button>
            <button class="nav-btn" onclick="window.location.replace('segnalazione.html')">Invia Segnalazione</button>
            <button class="nav-btn" style="color: #f44336;" onclick="window.location.replace('index.html')">Esci</button>
        </div>
    </nav>

    <div class="main-workspace">
        <div class="sidebar-fleet">
            <div class="fleet-title">Eco-Sharing Flotta</div>
            
            <div class="filter-group">
                <label>Tipologia Veicolo</label>
                <select id="tipo-veicolo" class="filter-select" onchange="caricaVeicoliFlotta()">
                    <option value="Tutti">🚲 Mostra Tutti i Mezzi</option>
                    <option value="Auto">🚗 Auto Elettriche</option>
                    <option value="Scooter">🛵 Scooter Elettrici</option>
                    <option value="Monopattino">🛴 Monopattini</option>
                </select>
            </div>

            <p style="color: var(--text-muted); font-size: 12px; margin-bottom: 5px;">Mezzi disponibili a Bari [BA-01]:</p>
            
            <div id="lista-veicoli"></div>
        </div>

        <div class="map-wrapper">
            <iframe class="map-iframe" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d48074.88727038753!2d16.835565345719327!3d41.11714264627239!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1347e8f533a1e943%3A0x307d9e262c8e310!2sBari%20BA!5e0!3m2!1sit!2sit!4v1710000000000!5m2!1sit!2sit" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://iqadvwrvmecpetuqpysn.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const veicoliMock = [
            { id: 1, codice: "Auto-L01", tipo: "Auto", nome: "Lithium Model S", batteria: 94, area: "Bari [BA-01]" },
            { id: 2, codice: "Scoot-Z03", tipo: "Scooter", nome: "Vespa E-Volt", batteria: 82, area: "Bari [BA-01]" },
            { id: 3, codice: "Pattino-X1", tipo: "Monopattino", nome: "Izalith Speed", batteria: 45, area: "Bari [BA-01]" }
        ];

        window.onload = function() {
            caricaVeicoliFlotta();
        };

        async function caricaVeicoliFlotta() {
            const listaDiv = document.getElementById("lista-veicoli");
            let tipoSelezionato = document.getElementById("tipo-veicolo").value;
            
            listaDiv.innerHTML = '<p class="no-vehicles">Ricerca telemetria mezzi...</p>';
            let veicoliVisualizzabili = [];

            try {
                let query = supabase.from('veicoli').select('*').eq('area', 'Bari [BA-01]');
                if (tipoSelezionato !== "Tutti") {
                    query = query.eq('tipo', tipoSelezionato);
                }
                const { data: veicoliCloud, error } = await query;
                
                if (!error && veicoliCloud && veicoliCloud.length > 0) {
                    veicoliVisualizzabili = veicoliCloud;
                } else {
                    veicoliVisualizzabili = veicoliMock.filter(m => tipoSelezionato === "Tutti" || m.tipo === tipoSelezionato);
                }
            } catch (e) {
                veicoliVisualizzabili = veicoliMock.filter(m => tipoSelezionato === "Tutti" || m.tipo === tipoSelezionato);
            }

            if (veicoliVisualizzabili.length === 0) {
                listaDiv.innerHTML = `<p class="no-vehicles">Nessun ${tipoSelezionato.toLowerCase()} disponibile.</p>`;
                return;
            }

            listaDiv.innerHTML = "";
            veicoliVisualizzabili.forEach(mezzo => {
                let icona = "🛴";
                if(mezzo.tipo === "Auto") icona = "🚗";
                if(mezzo.tipo === "Scooter") icona = "🛵";

                let div = document.createElement('div');
                div.className = "vehicle-box";
                div.onclick = function() { alert(`Mappa centrata sul mezzo ${mezzo.codice}`); };
                
                div.innerHTML = `
                    <div class="vehicle-meta">
                        <strong>${icona} ${mezzo.nome}</strong> 
                        <span class="battery-level" style="color: ${mezzo.batteria < 30 ? '#f44336' : '#4CAF50'}">${mezzo.batteria}%</span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 13px;">Codice: ${mezzo.codice}</p>
                    <button class="btn-rent" onclick="event.stopPropagation(); avviaNoleggioMock('${mezzo.codice}')">Noleggia Mezzo</button>
                `;
                listaDiv.appendChild(div);
            });
        }

        function avviaNoleggioMock(idMezzo) {
            sessionStorage.setItem("noleggioAttivo", "true");
            sessionStorage.setItem("idMezzo", idMezzo);
            alert(`Richiesta di sblocco inviata per il mezzo ${idMezzo}. Apertura porte/lucchetto avviata.`);
            window.location.replace('noleggio-attivo.html');
        }
    </script>
</body>
</html>
