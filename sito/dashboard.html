<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Mappa Veicoli</title>
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Navbar migliorata */
        .app-navbar { background-color: #0A0A0A; padding: 10px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; font-size: 20px; }
        .nav-menu { display: flex; gap: 15px; }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-weight: 500; font-size: 15px; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .nav-btn:hover, .nav-btn.active { color: var(--primary-orange); background: rgba(255,87,34,0.05); }
        
        /* Area Utente */
        .user-profile { display: flex; align-items: center; color: var(--text-muted); border-left: 1px solid var(--border-color); padding-left: 20px; }
        .user-email { color: var(--text-light); font-size: 13px; margin-right: 15px; }
        
        /* Main Workspace */
        .main-workspace { flex: 1; display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 65px); }
        .sidebar-fleet { background: var(--surface-card); border: 1px solid var(--border-color); padding: 25px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .fleet-title { font-size: 18px; font-weight: 600; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .filter-group { display: flex; flex-direction: column; gap: 6px; }
        .filter-select { background: #121212; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; color: white; width: 100%; }
        
        .vehicle-box { background: #121212; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .vehicle-meta { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .battery-level { font-weight: bold; font-size: 13px; }
        
        .map-wrapper { width: 100%; height: 100%; }
        .map-iframe { width: 100%; height: 100%; border: none; filter: grayscale(1) invert(1) contrast(1.2); }
        .btn-rent { background: var(--primary-orange); color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-brand" onclick="window.location.reload()">IZALITH</div>
        <div class="nav-menu">
            <button class="nav-btn active">Mappa</button>
            <button class="nav-btn" onclick="window.location.href='wallet.html'">Wallet</button>
        </div>
        <div class="user-profile">
            <span id="user-email" class="user-email"></span>
            <button class="nav-btn" onclick="logout()">Esci</button>
        </div>
    </nav>

    <div class="main-workspace">
        <div class="sidebar-fleet">
            <div class="fleet-title">Flotta Disponibile</div>
            <div class="filter-group">
                <select id="tipo-veicolo" class="filter-select" onchange="caricaVeicoliFlotta()">
                    <option value="Tutti">Tutti i mezzi</option>
                    <option value="Auto">Auto Elettriche</option>
                    <option value="Scooter">Scooter Elettrici</option>
                    <option value="Monopattino">Monopattini</option>
                </select>
            </div>
            <div id="lista-veicoli"></div>
        </div>
        <div class="map-wrapper">
            <iframe class="map-iframe" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d30043.68779657448!2d16.8523984!3d41.1256!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sit!2sit!4v1690000000000" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = supabase.createClient(
            "https://iqadvwrvmecpetuqpysn.supabase.co", 
            "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8"
        );

        window.onload = function() { 
            supabaseClient.auth.getSession().then(({ data }) => {
                if (!data.session) {
                    window.location.href = 'login-user.html';
                } else {
                    document.getElementById('user-email').innerText = data.session.user.email;
                    caricaVeicoliFlotta();
                }
            });
        };

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login-user.html';
        }

        async function caricaVeicoliFlotta() {
            const listaDiv = document.getElementById("lista-veicoli");
            const tipo = document.getElementById("tipo-veicolo").value;
            listaDiv.innerHTML = 'Sincronizzazione...';

            let query = supabaseClient.from('veicoli').select('*').eq('stato', 'Disponibile');
            if (tipo !== "Tutti") query = query.eq('tipo', tipo);
            
            const { data, error } = await query;
            
            if (error || !data || data.length === 0) {
                listaDiv.innerHTML = "Nessun veicolo trovato.";
                return;
            }

            listaDiv.innerHTML = "";
            data.forEach(m => {
                let div = document.createElement('div');
                div.className = "vehicle-box";
                div.innerHTML = `
                    <div class="vehicle-meta">
                        <strong>${m.nome}</strong>
                        <span class="battery-level">${m.batteria}%</span>
                    </div>
                    <button class="btn-rent" onclick="avviaNoleggio('${m.codice}')">Noleggia</button>
                `;
                listaDiv.appendChild(div);
            });
        }

        async function avviaNoleggio(codice) {
            const { error } = await supabaseClient.from('veicoli').update({ stato: 'In uso' }).eq('codice', codice);
            if (error) alert("Errore: " + error.message);
            else { alert("Noleggio avviato!"); window.location.href = 'noleggio-attivo.html'; }
        }
    </script>
</body>
</html>
