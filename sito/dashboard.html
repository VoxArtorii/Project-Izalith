<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Mappa Veicoli</title>

    <style>
        :root {
            --primary-orange: #ff5722;
            --dark-bg: #121212;
            --surface-card: #1E1E1E;
            --text-light: #FFFFFF;
            --text-muted: #A0A0A0;
            --border-color: #2C2C2C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .app-navbar {
            background-color: #0A0A0A;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            height: 65px;
            gap: 25px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            min-width: 0;
        }

        .nav-brand span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-shrink: 0;
        }

        .nav-user {
            color: var(--text-light);
            font-weight: 600;
            font-size: 14px;
            padding-right: 18px;
            border-right: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-item:hover,
        .nav-item.active {
            color: var(--primary-orange);
        }

        .logout {
            color: #f44336;
        }

        .logout:hover {
            color: #ff6b6b;
        }

        .main-workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 340px 1fr;
            height: calc(100vh - 65px);
        }

        .sidebar-fleet {
            background: var(--surface-card);
            border-right: 1px solid var(--border-color);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .fleet-title {
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        .filter-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .filter-select {
            background: #121212;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .vehicle-box {
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .vehicle-box:hover {
            border-color: var(--primary-orange);
        }

        .vehicle-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
        }

        .battery-level {
            color: #4CAF50;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
        }

        .map-wrapper {
            width: 100%;
            height: 100%;
            background: #222;
        }

        .map-iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: grayscale(1) invert(1) contrast(1.2);
        }

        .btn-rent {
            background: var(--primary-orange);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            margin-top: 12px;
            transition: background-color 0.2s;
        }

        .btn-rent:hover {
            background-color: #E64A19;
        }

        .no-vehicles {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 1100px) {
            .app-navbar {
                height: auto;
                min-height: 65px;
                flex-wrap: wrap;
            }

            .nav-menu {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
                gap: 15px;
            }

            .main-workspace {
                height: calc(100vh - 115px);
            }
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
            }

            .app-navbar {
                padding: 12px 18px;
                align-items: flex-start;
            }

            .nav-brand {
                font-size: 16px;
            }

            .nav-menu {
                gap: 12px;
            }

            .nav-user {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding-right: 0;
                padding-bottom: 10px;
            }

            .main-workspace {
                height: auto;
                display: flex;
                flex-direction: column;
            }

            .sidebar-fleet {
                max-height: 320px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .map-wrapper {
                height: 520px;
            }
        }
    </style>
</head>

<body>

    <nav class="app-navbar">
        <div class="nav-brand" onclick="window.location.href='dashboard.html'">
            <svg width="35" height="35" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5 C15 35 15 75 50 95 C85 75 85 35 50 5 Z" fill="#ff5722"/>
                <polygon points="52,15 35,52 48,52 44,82 65,42 50,42" fill="#FFFFFF"/>
            </svg>
            <span>IZALITH</span>
        </div>

        <div class="nav-menu">
            <span class="nav-user" id="utente-loggato">Utente</span>
            <a href="noleggio-attivo.html" class="nav-item">🚗 Noleggio</a>
            <a href="wallet.html" class="nav-item">💳 Wallet</a>
            <a href="segnalazione.html" class="nav-item">⚠️ Segnalazioni</a>
            <a href="#" class="nav-item logout" onclick="logout()">🚪 Logout</a>
        </div>
    </nav>

    <div class="main-workspace">
        <div class="sidebar-fleet">
            <div class="fleet-title">Eco-Sharing Flotta</div>

            <div class="filter-group">
                <label>Tipologia Veicolo</label>
                <select id="tipo-veicolo" class="filter-select" onchange="caricaVeicoliFlotta()">
                    <option value="Tutti">🚲 Mostra Tutti i Mezzi</option>
                    <option value="Auto">🚗 Auto Elettriche</option>
                    <option value="Scooter">🛵 Scooter Elettrici</option>
                    <option value="Monopattino">🛴 Monopattini</option>
                </select>
            </div>

            <div id="lista-veicoli"></div>
        </div>

        <div class="map-wrapper">
            <iframe
                class="map-iframe"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d48074.88727038753!2d16.835565345719327!3d41.11714264627239!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1347e8f533a1e943%3A0x307d9e262c8e310!2sBari%20BA!5e0!3m2!1sit!2sit!4v1710000000000!5m2!1sit!2sit"
                allowfullscreen=""
                loading="lazy">
            </iframe>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseClient = supabase.createClient(
            "https://iqadvwrvmecpetuqpysn.supabase.co",
            "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8"
        );

        window.onload = async function() {
            await controllaSessioneUtente();
        };

        async function controllaSessioneUtente() {
            const { data, error } = await supabaseClient.auth.getSession();

            if (error || !data.session) {
                window.location.href = "login-user.html";
                return;
            }

            caricaNomeUtente(data.session.user);
            caricaVeicoliFlotta();
        }

        function caricaNomeUtente(user) {
            const elementoUtente = document.getElementById("utente-loggato");
            const metadata = user.user_metadata || {};

            const nome = String(metadata.nome || metadata.Nome || "").trim();
            const cognome = String(metadata.cognome || metadata.Cognome || "").trim();
            const nomeCompleto = `${nome} ${cognome}`.trim();

            elementoUtente.innerText = nomeCompleto || "Utente";
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = "login-user.html";
        }

        async function caricaVeicoliFlotta() {
            const listaDiv = document.getElementById("lista-veicoli");
            const tipoSelezionato = document.getElementById("tipo-veicolo").value;

            listaDiv.innerHTML = '<p class="no-vehicles">Sincronizzazione flotta...</p>';

            try {
                let query = supabaseClient
                    .from("veicoli")
                    .select("*")
                    .eq("area_competenza", "BA-01")
                    .eq("stato", "Disponibile");

                if (tipoSelezionato !== "Tutti") {
                    query = query.eq("tipo", tipoSelezionato);
                }

                const { data: veicoli, error } = await query;

                if (error || !veicoli || veicoli.length === 0) {
                    listaDiv.innerHTML = '<p class="no-vehicles">Nessun veicolo disponibile nell&apos;area.</p>';
                    return;
                }

                listaDiv.innerHTML = "";

                veicoli.forEach(mezzo => {
                    const icona = mezzo.tipo === "Auto"
                        ? "🚗"
                        : mezzo.tipo === "Scooter"
                            ? "🛵"
                            : "🛴";

                    const batteria = mezzo.batteria !== null && mezzo.batteria !== undefined
                        ? mezzo.batteria
                        : "N/D";

                    let coloreBatteria = "#4CAF50";

                    if (batteria === "N/D") {
                        coloreBatteria = "var(--text-muted)";
                    } else if (Number(batteria) < 30) {
                        coloreBatteria = "#f44336";
                    }

                    const div = document.createElement("div");
                    div.className = "vehicle-box";

                    div.innerHTML = `
                        <div class="vehicle-meta">
                            <strong>${icona} ${escapeHTML(mezzo.nome || mezzo.codice || "Mezzo non identificato")}</strong>
                            <span class="battery-level" style="color: ${coloreBatteria}">
                                ${escapeHTML(batteria)}${batteria !== "N/D" ? "%" : ""}
                            </span>
                        </div>

                        <p style="color: var(--text-muted); font-size: 13px;">
                            Codice: ${escapeHTML(mezzo.codice || "N/D")}
                        </p>

                        <button class="btn-rent" onclick="avviaNoleggio('${escapeHTML(mezzo.codice || "")}')">
                            Noleggia Mezzo
                        </button>
                    `;

                    listaDiv.appendChild(div);
                });

            } catch (e) {
                listaDiv.innerHTML = '<p class="no-vehicles">Errore di connessione.</p>';
            }
        }

        async function avviaNoleggio(codiceMezzo) {
            if (!codiceMezzo) {
                alert("Codice mezzo non valido.");
                return;
            }

            if (!confirm(`Confermi di voler noleggiare il mezzo ${codiceMezzo}?`)) {
                return;
            }

            const { error } = await supabaseClient
                .from("veicoli")
                .update({ stato: "In uso" })
                .eq("codice", codiceMezzo);

            if (error) {
                alert("Errore durante il noleggio: " + error.message);
                return;
            }

            sessionStorage.setItem("idMezzo", codiceMezzo);
            alert(`Noleggio confermato per ${codiceMezzo}.`);
            window.location.href = "noleggio-attivo.html";
        }

        function escapeHTML(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
    </script>

</body>
</html>
