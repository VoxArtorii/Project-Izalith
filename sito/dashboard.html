<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Mappa Veicoli</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary-orange: #ff5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 65px; }
        .nav-brand { font-weight: bold; font-size: 20px; cursor: pointer; color: var(--primary-orange); }
        .nav-menu { display: flex; align-items: center; gap: 20px; }
        .nav-item { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; cursor: pointer; }
        .nav-item:hover { color: var(--primary-orange); }
        .main-workspace { flex: 1; display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 65px); }
        .sidebar-fleet { background: var(--surface-card); border-right: 1px solid var(--border-color); padding: 25px; overflow-y: auto; }
        .map-wrapper { width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; filter: grayscale(0.8) invert(1) hue-rotate(180deg) brightness(1.2); }
        .vehicle-box { background: #121212; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .btn-rent { background: var(--primary-orange); color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn-reserve { background: #2196F3; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 5px; font-weight: bold; }
        .custom-orange-marker { background-color: #FF5722; border: 2px solid white; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
        
        /* Nuovi elementi di stile per i filtri orari */
        .filter-section { border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px; }
        .filter-section label { font-size: 11px; color: var(--text-muted); display: block; margin-top: 8px; font-weight: bold; }
        .filter-section input { width: 100%; padding: 8px; background: #222; border: 1px solid var(--border-color); color: white; border-radius: 4px; margin-top: 3px; }
        .btn-filter { background: #4CAF50; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="app-navbar">
        <div class="nav-brand" onclick="window.location.href='dashboard.html'">IZALITH</div>
        <div class="nav-menu">
            <span id="saldo-display" style="color: var(--primary-orange); font-weight: bold; font-size: 14px;"></span>
            <a href="wallet.html" class="nav-item">💳 Wallet</a>
            <a href="mie-prenotazioni.html" class="nav-item">📅 Prenotazioni</a>
            <a href="noleggio-attivo.html" class="nav-item">🚗 Noleggio</a>
            <a href="segnalazione.html" class="nav-item">⚠️ Segnalazioni</a>
            <a href="#" class="nav-item" onclick="logout()">🚪 Logout</a>
        </div>
    </nav>
    <div class="main-workspace">
        <div class="sidebar-fleet">
            <div class="filter-section">
                <div style="font-weight:bold; font-size:12px; color:var(--primary-orange);">RICERCA DISPONIBILITÀ</div>
                <label>INIZIO PREVISTO</label>
                <input type="datetime-local" id="filtro-inizio">
                <label>FINE PREVISTA</label>
                <input type="datetime-local" id="filtro-fine">
                <button class="btn-filter" onclick="caricaVeicoliFlotta()">APPLICA FILTRO</button>
            </div>

            <div style="font-weight:bold; margin-bottom:15px;">FLOTTA ATTIVA</div>
            <select id="tipo-veicolo" style="width:100%; padding:8px; margin-bottom:15px; background:#222; color:white;" onchange="caricaVeicoliFlotta()">
                <option value="Tutti">Tutti i Mezzi</option>
                <option value="Auto">Auto</option>
                <option value="Scooter">Scooter</option>
                <option value="Monopattino">Monopattini</option>
            </select>
            <div id="lista-veicoli"></div>
        </div>
        <div class="map-wrapper"><div id="map"></div></div>
    </div>

    <script>
        const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        const map = L.map('map').setView([41.1171, 16.8719], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const orangeIcon = L.divIcon({ className: 'custom-orange-marker', iconSize: [20, 20], iconAnchor: [10, 20], popupAnchor: [0, -20] });
        const markerGroup = L.layerGroup().addTo(map);
        
        let areeVietateList = [];
        let areeSostaList = [];
        let ultimoAlert = 0; 

        window.onload = async () => {
            await caricaAreeVietate();
            await caricaAreeSosta();
            avviaMonitoraggioGPS();

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                const { data: utente } = await supabaseClient.from('utenti').select('wallet_balance').eq('id', user.id).single();
                if (utente) document.getElementById("saldo-display").innerText = `Saldo: ${utente.wallet_balance.toFixed(2)}€`;
            }
            caricaVeicoliFlotta();
        };

        async function caricaAreeVietate() {
            const { data: aree } = await supabaseClient.from('aree_vietate').select('nome, area');
            if (aree) {
                aree.forEach(a => {
                    const geojson = typeof a.area === 'string' ? JSON.parse(a.area) : a.area;
                    L.geoJSON(geojson, { style: { color: "red", weight: 2, fillOpacity: 0.1 } }).addTo(map).bindPopup("VIETATO: " + a.nome);
                    areeVietateList.push({ nome: a.nome, geometry: geojson });
                });
            }
        }

        async function caricaAreeSosta() {
            const { data: aree } = await supabaseClient.from('aree_sosta').select('nome, area');
            if (aree) {
                aree.forEach(a => {
                    const geojson = typeof a.area === 'string' ? JSON.parse(a.area) : a.area;
                    L.geoJSON(geojson, { style: { color: "blue", weight: 2, fillOpacity: 0.1, fillColor: "blue" } }).addTo(map).bindPopup("Parcheggio: " + a.nome);
                    areeSostaList.push({ nome: a.nome, geometry: geojson });
                });
            }
        }

        function avviaMonitoraggioGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((position) => {
                    checkProssimitaAree(position.coords.latitude, position.coords.longitude);
                }, (err) => console.log("GPS non attivo"), { enableHighAccuracy: true });
            }
        }

        function checkProssimitaAree(lat, lon) {
            const puntoCorrente = turf.point([lon, lat]);
            const ora = Date.now();
            areeVietateList.forEach(area => {
                const centroArea = turf.center(area.geometry);
                const distanza = turf.distance(puntoCorrente, centroArea, { units: 'meters' });
                if (distanza < 100 && (ora - ultimoAlert > 30000)) {
                    alert("⚠️ ATTENZIONE: Zona vietata (" + area.nome + "). Rallenta!");
                    ultimoAlert = ora;
                }
            });
        }

        async function caricaVeicoliFlotta() {
            markerGroup.clearLayers();
            const tipoSelezionato = document.getElementById("tipo-veicolo").value;
            const filtroInizio = document.getElementById("filtro-inizio").value;
            const filtroFine = document.getElementById("filtro-fine").value;
            
            let veicoliOccupati = [];

            if (filtroInizio && filtroFine) {
                let inizioRichiesto = new Date(filtroInizio);
                let fineRichiesta = new Date(filtroFine);

                let inizioConAnticipo = new Date(inizioRichiesto);
                inizioConAnticipo.setMinutes(inizioConAnticipo.getMinutes() - 30);

                const { data: prenotazioniSovrapposte } = await supabaseClient
                    .from("prenotazioni")
                    .select("veicolo_id, data_inizio_prevista, data_fine_prevista");

                if (prenotazioniSovrapposte) {
                    prenotazioniSovrapposte.forEach(p => {
                        let pInizio = new Date(p.data_inizio_prevista);
                        let pFine = new Date(p.data_fine_prevista);
                        
                        if (inizioRichiesto < pFine && fineRichiesta > new Date(pInizio.getTime() - 30 * 60000)) {
                            veicoliOccupati.push(p.veicolo_id);
                        }
                    });
                }
            } else {
                const { data: prenotazioniImminenti } = await supabaseClient
                    .from("prenotazioni")
                    .select("veicolo_id, data_inizio_prevista");

                if (prenotazioniImminenti) {
                    let adesso = new Date();
                    prenotazioniImminenti.forEach(p => {
                        let pInizio = new Date(p.data_inizio_prevista);
                        let diffMinuti = (pInizio - adesso) / (1000 * 60);
                        
                        if (diffMinuti > 0 && diffMinuti <= 30) {
                            veicoliOccupati.push(p.veicolo_id);
                        }
                    });
                }
            }
            
            let query = supabaseClient.from("veicoli").select("*").eq("stato", "Disponibile");
            
            if (tipoSelezionato !== "Tutti") {
                query = query.eq("tipo", tipoSelezionato);
            }
            
            const { data: veicoli } = await query;
            const div = document.getElementById("lista-veicoli");
            div.innerHTML = "";
            
            veicoli?.forEach(v => {
                if (veicoliOccupati.includes(v.codice)) return;

                div.innerHTML += `
                    <div class="vehicle-box">
                        <strong>${v.nome}</strong><br>
                        Batteria: ${v.batteria}%<br>
                        <button class="btn-rent" onclick="avviaNoleggio('${v.codice}')">Noleggia (2.50€)</button>
                        <button class="btn-reserve" onclick="gestisciPrenotazionePulsante('${v.codice}')">Prenota Veicolo</button>
                    </div>`;
                if(v.latitudine && v.longitudine) {
                    L.marker([v.latitudine, v.longitudine], {icon: orangeIcon}).addTo(markerGroup).bindPopup(`<b>${v.nome}</b><br><button onclick="gestisciPrenotazionePulsante('${v.codice}')" style="background:#2196F3;color:white;border:none;padding:5px;cursor:pointer;margin-top:5px;border-radius:4px;width:100%;">Prenota</button>`);
                }
            });
        }

        async function avviaNoleggio(codiceMezzo) {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                alert("Devi effettuare il login.");
                window.location.href = "login-user.html";
                return;
            }

            if (!confirm("Vuoi procedere con il noleggio del veicolo " + codiceMezzo + "?")) return;

            try {
                const { error: insertError } = await supabaseClient
                    .from("noleggi")
                    .insert([{ 
                        utente_id: user.id, 
                        veicolo_id: codiceMezzo, 
                        stato: "Attivo", 
                        data_inizio: new Date().toISOString() 
                    }]);
                if (insertError) throw insertError;

                const { error: updateError } = await supabaseClient
                    .from("veicoli")
                    .update({ stato: "In uso" })
                    .eq("codice", codiceMezzo);
                if (updateError) throw updateError;

                alert("Noleggio avviato!");
                window.location.href = "noleggio-attivo.html";
            } catch (err) {
                alert("Errore: " + err.message);
            }
        }

        // FUNZIONE AGGIORNATA: Calcola l'offset ISO del Timezone locale (es: +02:00) per evitare sfasamenti su Supabase
        async function gestisciPrenotazionePulsante(codiceMezzo) {
            const filtroInizio = document.getElementById("filtro-inizio").value;
            const filtroFine = document.getElementById("filtro-fine").value;

            // Helper per ricavare la stringa di Timezone esatta del browser (+02:00, +01:00, ecc.)
            const ottieniTimezoneOffset = () => {
                const offset = new Date().getTimezoneOffset();
                const absOffset = Math.abs(offset);
                const ore = String(Math.floor(absOffset / 60)).padStart(2, '0');
                const minuti = String(absOffset % 60).padStart(2, '0');
                return (offset <= 0 ? '+' : '-') + ore + ':' + minuti;
            };

            const tzOffset = ottieniTimezoneOffset();
            let dataInizioStr, dataFineStr;

            if (filtroInizio && filtroFine) {
                // Esempio output finale accettato da Supabase: "2026-06-15T21:00:00+02:00"
                dataInizioStr = `${filtroInizio}:00${tzOffset}`;
                dataFineStr = `${filtroFine}:00${tzOffset}`;
                await avviaPrenotazione(codiceMezzo, dataInizioStr, dataFineStr, false);
            } else {
                // Prenotazione Istantanea
                let oraLocale = new Date();
                let scadenzaLocale = new Date(Date.now() + 60 * 60 * 1000);
                
                const formattaConTimezone = (d) => {
                    const pad = (n) => String(n).padStart(2, '0');
                    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${tzOffset}`;
                };
                
                await avviaPrenotazione(codiceMezzo, formattaConTimezone(oraLocale), formattaConTimezone(scadenzaLocale), true);
            }
        }

        async function avviaPrenotazione(codiceMezzo, dataInizio, dataFine, esecuzioneIstantanea) {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                alert("Devi effettuare il login.");
                window.location.href = "login-user.html";
                return;
            }

            if (!confirm("Vuoi prenotare il veicolo " + codiceMezzo + " per garantirne la disponibilità?")) return;

            try {
                const { error: insertError } = await supabaseClient
                    .from("prenotazioni")
                    .insert([{ 
                        utente_id: user.id, 
                        veicolo_id: codiceMezzo, 
                        data_inizio_prevista: dataInizio,
                        data_fine_prevista: dataFine,
                        tipo_prenotazione: esecuzioneIstantanea ? 'Istantanea' : 'Programmata'
                    }]);
                if (insertError) throw insertError;

                if (esecuzioneIstantanea) {
                    await supabaseClient.from("veicoli").update({ stato: "Prenotato" }).eq("codice", codiceMezzo);
                }

                alert("Veicolo prenotato con successo!");
                window.location.href = "mie-prenotazioni.html";
            } catch (err) {
                alert("Errore durante la prenotazione: " + err.message);
            }
        }

        async function logout() { 
            await supabaseClient.auth.signOut(); 
            window.location.href = "login-user.html"; 
        }
    </script>
</body>
</html>
