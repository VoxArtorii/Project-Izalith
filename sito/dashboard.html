<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Mappa Veicoli</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ... (mantieni tutto il tuo CSS originale intatto) ... */
        :root { --primary-orange: #ff5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 65px; gap: 25px; }
        .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; font-size: 20px; }
        .nav-menu { display: flex; align-items: center; gap: 22px; }
        .nav-item { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; cursor: pointer; }
        .nav-item:hover { color: var(--primary-orange); }
        .main-workspace { flex: 1; display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 65px); }
        .sidebar-fleet { background: var(--surface-card); border-right: 1px solid var(--border-color); padding: 25px; overflow-y: auto; }
        .map-wrapper { width: 100%; height: 100%; background: #222; }
        #map { width: 100%; height: 100%; filter: grayscale(1) invert(1) contrast(1.2); }
        .vehicle-box { background: #121212; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .btn-rent { background: var(--primary-orange); color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>

<body>
    <nav class="app-navbar">
        <div class="nav-brand" onclick="window.location.href='dashboard.html'">IZALITH</div>
        <div class="nav-menu">
            <span id="utente-loggato">Caricamento...</span>
            <a href="noleggio-attivo.html" class="nav-item">🚗 Noleggio</a>
            <a href="segnalazione.html" class="nav-item">⚠️ Segnalazioni</a>
            <a href="#" class="nav-item" onclick="logout()">🚪 Logout</a>
        </div>
    </nav>

    <div class="main-workspace">
        <div class="sidebar-fleet">
            <div id="lista-veicoli">Caricamento flotta...</div>
        </div>
        <div class="map-wrapper">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        let map;

        window.onload = async () => {
            map = L.map('map').setView([41.1171, 16.8719], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            await controllaSessioneUtente();
        };

        async function caricaVeicoliFlotta() {
            const listaDiv = document.getElementById("lista-veicoli");
            // Rimosso filtro area_competenza temporaneamente per vedere se carica i dati
            const { data: veicoli, error } = await supabaseClient.from("veicoli").select("*").eq("stato", "Disponibile");

            if (error) { console.error(error); return; }
            
            listaDiv.innerHTML = "";
            veicoli.forEach(mezzo => {
                // Aggiungi marker mappa
                if(mezzo.latitudine && mezzo.longitudine) {
                    L.marker([mezzo.latitudine, mezzo.longitudine]).addTo(map).bindPopup(mezzo.nome);
                }

                const div = document.createElement("div");
                div.className = "vehicle-box";
                div.innerHTML = `<strong>${mezzo.nome}</strong><br>Batteria: ${mezzo.batteria}%<button class="btn-rent" onclick="avviaNoleggio('${mezzo.codice}')">Noleggia</button>`;
                listaDiv.appendChild(div);
            });
        }
        
        // ... (mantieni le tue funzioni logout, avviaNoleggio, ecc.)
    </script>
</body>
</html>
