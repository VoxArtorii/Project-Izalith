<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Noleggio in Corso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: #1E1E1E; padding: 30px; border-radius: 12px; width: 400px; text-align: center; }
        .btn-end { background: #f44336; color: white; border: none; padding: 15px; width: 100%; margin-top: 20px; border-radius: 8px; cursor: pointer; }
        .btn-toggle { background: #4CAF50; color: white; border: none; padding: 15px; width: 100%; margin-top: 10px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card" id="content">
        <h3>Caricamento...</h3>
    </div>

    <script>
        const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        
        let motoreAcceso = false;
        let areeSostaList = [];

        async function init() {
            // 1. Carica le aree di sosta autorizzate
            const { data: aree } = await supabaseClient.from("aree_sosta").select("area");
            if (aree) {
                areeSostaList = aree.map(a => typeof a.area === 'string' ? JSON.parse(a.area) : a.area);
                console.log("📍 Aree sosta caricate dal database:", areeSostaList.length);
            }

            // 2. Carica il noleggio attivo per questo utente
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = "login-user.html"; return; }

            const { data: noleggio, error } = await supabaseClient.from("noleggi")
                .select("*").eq("utente_id", user.id).eq("stato", "Attivo").single();
            
            if (error || !noleggio) {
                document.getElementById("content").innerHTML = "<h3>Nessun noleggio attivo</h3><a href='dashboard.html' style='color:white;'>Torna alla mappa</a>";
                return;
            }
            
            document.getElementById("content").innerHTML = `
                <h3>Noleggio in corso</h3>
                <p>Veicolo: ${noleggio.veicolo_id}</p>
                <button id="btn-motore" class="btn-toggle" onclick="toggleMotore()">ACCENDI MOTORE</button>
                <button class="btn-end" onclick="terminaNoleggio('${noleggio.veicolo_id}', ${noleggio.id})">TERMINA NOLEGGIO</button>
            `;
        }

        function toggleMotore() {
            const btn = document.getElementById("btn-motore");
            motoreAcceso = !motoreAcceso;
            btn.innerText = motoreAcceso ? "SPEGNI MOTORE" : "ACCENDI MOTORE";
            btn.style.background = motoreAcceso ? "#f44336" : "#4CAF50";
        }

        // NUOVA FUNZIONE: Controlla la posizione del VEICOLO (non del telefono)
        async function checkPosizioneVeicolo(codiceVeicolo) {
            console.log("🔍 Controllo posizione veicolo dal database...");
            
            // Recupera coordinate del veicolo dal DB
            const { data: veicolo, error } = await supabaseClient
                .from("veicoli")
                .select("latitudine, longitudine")
                .eq("codice", codiceVeicolo)
                .single();

            if (error || !veicolo) {
                console.error("Errore recupero posizione:", error);
                alert("Errore: impossibile verificare la posizione del veicolo.");
                return false;
            }

            console.log("📍 Coordinate veicolo dal DB (Lon, Lat):", [veicolo.longitudine, veicolo.latitudine]);

            // Verifica geofencing con Turf.js
            const puntoVeicolo = turf.point([veicolo.longitudine, veicolo.latitudine]);
            const inArea = areeSostaList.some(poly => turf.booleanPointInPolygon(puntoVeicolo, poly));
            
            console.log("✅ Veicolo in area autorizzata?", inArea);
            return inArea;
        }

        async function terminaNoleggio(codice, id) {
            if (motoreAcceso) {
                alert("⚠️ Spegni il motore prima di terminare il noleggio!");
                return;
            }

            // Controllo basato sulla posizione del veicolo
            const inZona = await checkPosizioneVeicolo(codice);
            
            if (!inZona) {
                alert("🚫 Non puoi terminare il noleggio: il veicolo non si trova in un'area blu autorizzata.");
                return;
            }

            // Se tutto ok, conclude il noleggio
            try {
                await supabaseClient.from("noleggi").update({ stato: "Concluso", data_fine: new Date().toISOString() }).eq("id", id);
                await supabaseClient.from("veicoli").update({ stato: "Disponibile" }).eq("codice", codice);
                alert("Noleggio terminato correttamente!");
                window.location.href = "dashboard.html";
            } catch (err) { alert("Errore DB: " + err.message); }
        }
        
        init();
    </script>
</body>
</html>
