<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Noleggio in Corso</title>

    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: #1E1E1E; padding: 30px; border-radius: 12px; width: 400px; text-align: center; }
        .btn-end { background: #f44336; color: white; border: none; padding: 15px; width: 100%; margin-top: 20px; border-radius: 8px; cursor: pointer; }

<body>
    <div class="card" id="content">
        <h3>Caricamento...</h3>
    </div>

    <script>
        const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        
        let motoreAcceso = false;
        let areeSostaList = [];

        async function init() {
            // 1. Carica le aree
            const { data: aree } = await supabaseClient.from("aree_sosta").select("area");
            if (aree) {
                // Parse corretto delle geometrie
                areeSostaList = aree.map(a => typeof a.area === 'string' ? JSON.parse(a.area) : a.area);
                console.log("📍 Aree sosta caricate:", areeSostaList.length);
            }

            // 2. Carica noleggio
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = "login-user.html"; return; }

            const { data: noleggio, error } = await supabaseClient.from("noleggi")
                .select("*").eq("utente_id", user.id).eq("stato", "Attivo").single();
            
            if (error || !noleggio) {
                document.getElementById("content").innerHTML = "<h3>Nessun noleggio attivo</h3><a href='dashboard.html' style='color:white;'>Torna alla mappa</a>";
                return;
            }
            
            document.getElementById("content").innerHTML = `
                <h3>Noleggio in corso</h3>
                <p>Veicolo: ${noleggio.veicolo_id}</p>
                <button id="btn-motore" class="btn-toggle" onclick="toggleMotore()">ACCENDI MOTORE</button>
                <button class="btn-end" onclick="terminaNoleggio('${noleggio.veicolo_id}', ${noleggio.id})">TERMINA NOLEGGIO</button>
            `;
        }

        function toggleMotore() {
            const btn = document.getElementById("btn-motore");
            motoreAcceso = !motoreAcceso;
            btn.innerText = motoreAcceso ? "SPEGNI MOTORE" : "ACCENDI MOTORE";
            btn.style.background = motoreAcceso ? "#f44336" : "#4CAF50";
        }
