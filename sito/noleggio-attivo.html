<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Noleggio in Corso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <style>
        :root { --primary-orange: #ff5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout a due colonne: Sidebar comandi + Area Mappa Meticolosa */
        .sidebar-panel { width: 400px; background: var(--surface-card); border-right: 1px solid var(--border-color); padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .map-container { flex: 1; height: 100%; }
        #map { width: 100%; height: 100%; filter: grayscale(0.8) invert(1) hue-rotate(180deg) brightness(1.2); }

        /* Stili Pulsanti */
        .btn-end { background: #f44336; color: white; border: none; padding: 13px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-toggle { background: #4CAF50; color: white; border: none; padding: 13px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-search { background: #2196F3; color: white; border: none; padding: 13px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-charge { background: #FF9800; color: white; border: none; padding: 13px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-stop-charge { background: #9e9e9e; color: white; border: none; padding: 13px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-pause { background: #FFEB3B; color: black; border: none; padding: 13px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-resume { background: #4CAF50; color: white; border: none; padding: 13px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-route { background: var(--primary-orange); color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 8px; }

        /* Input Destinazione Navigatore */
        .route-box { background: #121212; border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-top: 5px; }
        .route-box input { width: 100%; padding: 10px; background: #222; border: 1px solid var(--border-color); color: white; border-radius: 4px; margin-top: 5px; }
        
        .text-paused { color: #FFEB3B; font-weight: bold; }
        .text-charging { color: #00BCD4; font-weight: bold; }
        .popup-search { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 15px 30px; border-radius: 8px; border-left: 5px solid #2196F3; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1000; font-weight: bold; }
        .custom-orange-marker { background-color: #FF5722; border: 2px solid white; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
    </style>
</head>
<body>

    <div id="popup-ricerca" class="popup-search">Il suo veicolo sta suonando</div>

    <div class="sidebar-panel" id="content">
        <h3>Caricamento...</h3>
    </div>

    <div class="map-container">
        <div id="map"></div>
    </div>

    <script>
        const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        
        let map;
        let routingControl = null;
        let veicoloMarker = null;
        let motoreAcceso = false;
        let areeSostaList = [];
        let datiNoleggioCorrente = null; 
        const orangeIcon = L.divIcon({ className: 'custom-orange-marker', iconSize: [20, 20], iconAnchor: [10, 20], popupAnchor: [0, -20] });

        async function init() {
            // Inizializza mappa Leaflet
            map = L.map('map').setView([41.1171, 16.8719], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // 1. Carica le aree di sosta autorizzate
            const { data: aree } = await supabaseClient.from("aree_sosta").select("area");
            if (aree) {
                areeSostaList = aree.map(a => typeof a.area === 'string' ? JSON.parse(a.area) : a.area);
                console.log("📍 Aree sosta caricate:", areeSostaList.length);
            }

            // 2. Carica il noleggio attivo per questo utente
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = "login-user.html"; return; }

            const { data: noleggio, error } = await supabaseClient.from("noleggi")
                .select("*")
                .eq("utente_id", user.id)
                .in("stato", ["Attivo", "In Pausa"])
                .single();
            
            if (error || !noleggio) {
                document.getElementById("content").innerHTML = "<h3>Nessun noleggio attivo</h3><a href='dashboard.html' style='color:white;'>Torna alla mappa</a>";
                return;
            }
            
            datiNoleggioCorrente = noleggio; 

            // Disegna il marker del veicolo sulla mappa prendendo le coordinate reali dal database
            await aggiornaMappaPosizioneVeicolo();

            if (datiNoleggioCorrente.stato === "In Pausa") {
                mostraNoleggioInPausa();
            } else {
                mostraNoleggioAttivo();
            }
        }

        async function aggiornaMappaPosizioneVeicolo() {
            const { data: v } = await supabaseClient.from("veicoli").select("latitudine, longitudine, nome").eq("codice", datiNoleggioCorrente.veicolo_id).single();
            if (v && v.latitudine && v.longitudine) {
                if (veicoloMarker) map.removeLayer(veicoloMarker);
                veicoloMarker = L.marker([v.latitudine, v.longitudine], {icon: orangeIcon}).addTo(map).bindPopup(`Il tuo veicolo: ${v.nome}`).openPopup();
                map.setView([v.latitudine, v.longitudine], 15);
            }
        }

        function mostraNoleggioAttivo() {
            document.getElementById("content").innerHTML = `
                <h3>Noleggio in corso</h3>
                <p style="color: var(--text-muted); font-size: 13px;">Codice Mezzo: ${datiNoleggioCorrente.veicolo_id}</p>
                <hr style="border-color: var(--border-color); margin: 5px 0;">
                
                <button id="btn-motore" class="btn-toggle" onclick="toggleMotore()">${motoreAcceso ? "SPEGNI MOTORE" : "ACCENDI MOTORE"}</button>
                <button class="btn-search" onclick="ricercaVeicolo()">RICERCA IL MIO VEICOLO</button>
                <button class="btn-charge" onclick="attivaRicarica()">RICARICA VEICOLO</button>
                <button id="btn-pausa" class="btn-pause" onclick="mettiInPausa()">METTI IN PAUSA</button>
                
                <div class="route-box">
                    <div style="font-weight:bold; font-size:12px; color:var(--primary-orange);">🗺️ NAVIGATORE STRADALE</div>
                    <label style="font-size:11px; color:#aaa; display:block; margin-top:5px;">INSERISCI DESTINAZIONE</label>
                    <input type="text" id="destinazione-input" placeholder="Es: Via Sparano, Bari">
                    <button class="btn-route" onclick="calcolaPercorsoVeloce()">TROVA PERCORSO PIÙ VELOCE</button>
                </div>

                <button class="btn-end" onclick="terminaNoleggio('${datiNoleggioCorrente.veicolo_id}', ${datiNoleggioCorrente.id})">TERMINA NOLEGGIO</button>
            `;
            if (motoreAcceso) {
                const btn = document.getElementById("btn-motore");
                if (btn) btn.style.background = "#f44336";
            }
        }

        // Calcolo del percorso stradale basato sulla posizione attuale del mezzo
        async function calcolaPercorsoVeloce() {
            const destinazioneTesto = document.getElementById("destinazione-input").value;
            if (!destinazioneTesto) { alert("Inserisci una destinazione!"); return; }

            // 1. Legge la posizione corrente aggiornata del veicolo dal database
            const { data: v } = await supabaseClient.from("veicoli").select("latitudine, longitudine").eq("codice", datiNoleggioCorrente.veicolo_id).single();
            if (!v || !v.latitudine || !v.longitudine) { alert("Impossibile rilevare la geolocalizzazione del veicolo."); return; }

            // 2. Chiamata di Geocoding gratuita (Nominatim OpenStreetMap) per convertire l'indirizzo in Lat/Lng
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destinazioneTesto)}`);
                const result = await response.json();
                if (result.length === 0) { alert("Indirizzo non trovato, sii più specifico."); return; }
                
                const latDest = parseFloat(result[0].lat);
                const lngDest = parseFloat(result[0].lon);

                // 3. Rimuove eventuali tracciati precedenti sulla mappa
                if (routingControl) map.removeControl(routingControl);

                // 4. Iniezione del tracciato stradale ottimale e visualizzazione tempo/distanza
                routingControl = L.Routing.control({
                    waypoints: [
                        L.latLng(v.latitudine, v.longitudine), // Partenza A (Veicolo)
                        L.latLng(latDest, lngDest)             // Arrivo B (Scelta utente)
                    ],
                    router: L.Routing.osrmv1({
                        // OSRM calcola l'itinerario dinamico ideale per la guida urbana
                        serviceUrl: 'https://router.project-osrm.org/route/v1'
                    }),
                    lineOptions: {
                        styles: [{ color: '#ff5722', opacity: 0.8, weight: 6 }] // Linea arancione Izalith
                    },
                    show: true // Mostra il pannello con le indicazioni di svolta e minuti stimati
                }).addTo(map);

            } catch (err) {
                console.error(err);
                alert("Errore durante il calcolo dell'itinerario.");
            }
        }

        function toggleMotore() {
            const btn = document.getElementById("btn-motore");
            const btnPausa = document.getElementById("btn-pausa");
            motoreAcceso = !motoreAcceso;
            btn.innerText = motoreAcceso ? "SPEGNI MOTORE" : "ACCENDI MOTORE";
            btn.style.background = motoreAcceso ? "#f44336" : "#4CAF50";
            if (btnPausa) {
                btnPausa.disabled = motoreAcceso;
                btnPausa.style.opacity = motoreAcceso ? "0.5" : "1";
                btnPausa.style.cursor = motoreAcceso ? "not-allowed" : "pointer";
            }
        }

        function ricercaVeicolo() {
            const popup = document.getElementById("popup-ricerca");
            popup.style.display = "block";
            setTimeout(() => { popup.style.display = "none"; }, 5000); 
        }

        function attivaRicarica() {
            if (routingControl) map.removeControl(routingControl);
            document.getElementById("content").innerHTML = `
                <h3 class="text-charging">Il veicolo è in carica</h3>
                <p>Veicolo: ${datiNoleggioCorrente.veicolo_id}</p>
                <button class="btn-stop-charge" onclick="mostraNoleggioAttivo()">INTERROMPI RICARICA</button>
            `;
        }

        async function mettiInPausa() {
            if (motoreAcceso) { alert("⚠️ Spegni il motore prima di mettere in pausa il noleggio!"); return; }
            try {
                await supabaseClient.from("noleggi").update({ stato: "In Pausa" }).eq("id", datiNoleggioCorrente.id);
                datiNoleggioCorrente.stato = "In Pausa";
                if (routingControl) map.removeControl(routingControl);
                mostraNoleggioInPausa();
            } catch (err) { alert("Errore: " + err.message); }
        }

        async function riprendiNoleggio() {
            try {
                await supabaseClient.from("noleggi").update({ stato: "Attivo" }).eq("id", datiNoleggioCorrente.id);
                datiNoleggioCorrente.stato = "Attivo";
                mostraNoleggioAttivo();
            } catch (err) { alert("Errore: " + err.message); }
        }

        function mostraNoleggioInPausa() {
            document.getElementById("content").innerHTML = `
                <h3 class="text-paused">|| Noleggio in Pausa</h3>
                <p>Veicolo: ${datiNoleggioCorrente.veicolo_id}</p>
                <p style="font-size: 0.9em; color: #aaa;">Il motore è bloccato. Nessun altro può prenotare questo mezzo.</p>
                <button class="btn-resume" onclick="riprendiNoleggio()">RIPRENDI NOLEGGIO</button>
            `;
        }

        async function checkPosizioneVeicolo(codiceVeicolo) {
            const { data: veicolo, error } = await supabaseClient.from("veicoli").select("latitudine, longitudine").eq("codice", codiceVeicolo).single();
            if (error || !veicolo) return false;
            const puntoVeicolo = turf.point([veicolo.longitudine, veicolo.latitudine]);
            const inArea = areeSostaList.some(poly => turf.booleanPointInPolygon(puntoVeicolo, poly));
            return inArea;
        }

        async function terminaNoleggio(codice, id) {
            if (motoreAcceso) { alert("⚠️ Spegni il motore prima di terminare il noleggio!"); return; }
            const inZona = await checkPosizioneVeicolo(codice);
            if (!inZona) { alert("🚫 Non puoi terminare il noleggio: il veicolo non si trova in un'area sosta autorizzata."); return; }
            try {
                await supabaseClient.from("noleggi").update({ stato: "Concluso", data_fine: new Date().toISOString() }).eq("id", id);
                await supabaseClient.from("veicoli").update({ stato: "Disponibile" }).eq("codice", codice);
                alert("Noleggio terminato correttamente!");
                window.location.href = "dashboard.html";
            } catch (err) { alert("Errore DB: " + err.message); }
        }
        
        init();
    </script>
</body>
</html>
