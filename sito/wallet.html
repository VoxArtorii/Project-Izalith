<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Gestione Wallet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); min-height: 100vh; }
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; font-weight: bold; font-size: 20px; }
        .content-container { max-width: 900px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }
        .card { background: var(--surface-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; }
        .balance-display { font-size: 38px; font-weight: bold; color: var(--primary-orange); margin: 15px 0; }
        .btn-quick { background: #333; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .btn-pay { background: var(--primary-orange); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .history-table th, .history-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <a href="dashboard.html" class="nav-brand">IZALITH</a>
        <div class="nav-menu" style="display:flex; gap:20px;">
            <a href="dashboard.html" style="color:white; text-decoration:none;">Torna alla Mappa</a>
        </div>
    </nav>

    <div class="content-container">
        <div class="card">
            <h3>Saldo Disponibile</h3>
            <div class="balance-display" id="saldo-attuale">€ 0,00</div>
            
            <h4>Seleziona Importo</h4>
            <div style="margin: 15px 0;">
                <button class="btn-quick" onclick="setAmount(10)">+ €10</button>
                <button class="btn-quick" onclick="setAmount(20)">+ €20</button>
                <button class="btn-quick" onclick="setAmount(50)">+ €50</button>
            </div>
            <input type="number" id="amount" class="input-money" style="background:#000; color:white; padding:10px; width:100%; border:1px solid #333;" value="10">
            <button class="btn-pay" onclick="processaRicarica()">Conferma Ricarica</button>
        </div>

        <div class="card">
            <h3>Storico Movimenti</h3>
            <table class="history-table">
                <thead><tr><th>Data</th><th>Descrizione</th><th>Importo</th></tr></thead>
                <tbody id="storico-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const supabase = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        let userId = "";

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) window.location.href = "login-user.html";
            userId = user.id;
            aggiornaDati();
        }

        async function aggiornaDati() {
            // Carica Saldo
            const { data: utente } = await supabase.from('utenti').select('wallet_balance').eq('id', userId).single();
            document.getElementById('saldo-attuale').innerText = `€ ${utente.wallet_balance.toFixed(2)}`;

            // Carica Storico
            const { data: transazioni } = await supabase.from('storico_transazioni').select('*').eq('user_id', userId).order('created_at', { ascending: false });
            const tbody = document.getElementById('storico-body');
            tbody.innerHTML = transazioni.map(t => `<tr><td>${new Date(t.created_at).toLocaleDateString()}</td><td>${t.descrizione}</td><td style="color:${t.importo > 0 ? '#4CAF50' : '#f44336'}">${t.importo > 0 ? '+' : ''}€ ${t.importo}</td></tr>`).join('');
        }

        function setAmount(val) { document.getElementById('amount').value = val; }

        async function processaRicarica() {
            const importo = parseFloat(document.getElementById('amount').value);
            const { data: utente } = await supabase.from('utenti').select('wallet_balance').eq('id', userId).single();
            
            // Aggiorna saldo
            await supabase.from('utenti').update({ wallet_balance: utente.wallet_balance + importo }).eq('id', userId);
            // Log transazione
            await supabase.from('storico_transazioni').insert([{ user_id: userId, importo: importo, descrizione: "Ricarica Wallet" }]);
            
            alert("Ricarica effettuata!");
            aggiornaDati();
        }

        init();
    </script>
</body>
</html>
