<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Registrazione Nuovo Utente</title>
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; min-height: 100vh; }
        .header-simple { padding: 20px; text-align: center; border-bottom: 1px solid var(--border-color); background: #0A0A0A; }
        .reg-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .reg-card { background: var(--surface-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 35px; width: 100%; max-width: 550px; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #BBB; }
        .form-group input { background: #121212; border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; color: white; font-size: 14px; }
        .btn-submit { grid-column: span 2; background-color: var(--primary-orange); color: white; border: none; padding: 14px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .status-message { grid-column: span 2; padding: 12px; border-radius: 6px; font-size: 14px; text-align: center; display: none; }
        .error-style { background: rgba(244, 67, 54, 0.1); border: 1px solid #f44336; color: #f44336; }
        .success-style { background: rgba(76, 175, 80, 0.1); border: 1px solid #4CAF50; color: #4CAF50; }
    </style>
</head>
<body>

    <div class="header-simple">
        <svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5 C15 35 15 75 50 95 C85 75 85 35 50 5 Z" fill="#FF5722"/>
            <polygon points="52,15 35,52 48,52 44,82 65,42 50,42" fill="#FFFFFF"/>
        </svg>
    </div>

    <div class="reg-container">
        <div class="reg-card">
            <h2>Crea il tuo Profilo</h2>
            <form id="reg-form">
                <div id="status-box" class="status-message"></div>
                <div class="form-group"><label>Nome</label><input type="text" id="nome" required></div>
                <div class="form-group"><label>Cognome</label><input type="text" id="cognome" required></div>
                <div class="form-group full-width"><label>Email</label><input type="email" id="email" required></div>
                <div class="form-group full-width"><label>Codice Fiscale</label><input type="text" id="cf" required maxlength="16"></div>
                <div class="form-group"><label>Password</label><input type="password" id="pass" required minlength="6"></div>
                <div class="form-group"><label>Conferma</label><input type="password" id="pass-conf" required minlength="6"></div>
                <button type="submit" id="btn-submit" class="btn-submit">Registrati</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Inizializzazione corretta con URL di base
        const supabase = supabase.createClient(
            "https://iqadvwrvmecpetuqpysn.supabase.co", 
            "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8"
        );
        
        document.getElementById('reg-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusBox = document.getElementById("status-box");
            const btn = document.getElementById("btn-submit");
            
            statusBox.style.display = "none";
            
            const email = document.getElementById("email").value;
            const pass = document.getElementById("pass").value;
            const passConf = document.getElementById("pass-conf").value;

            if (pass !== passConf) {
                statusBox.innerText = "Le password non coincidono.";
                statusBox.className = "status-message error-style";
                statusBox.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Caricamento...";

            try {
                // 1. Auth SignUp
                const { data: auth, error: authErr } = await supabase.auth.signUp({ 
                    email: email, 
                    password: pass 
                });
                
                if (authErr) throw authErr;

                // 2. Insert into 'utenti'
                const { error: dbErr } = await supabase.from('utenti').insert([{
                    id: auth.user.id,
                    nome: document.getElementById("nome").value,
                    cognome: document.getElementById("cognome").value,
                    codice_fiscale: document.getElementById("cf").value,
                    email: email,
                    wallet_balance: 0
                }]);
                
                if (dbErr) throw dbErr;

                statusBox.innerText = "Registrazione completata!";
                statusBox.className = "status-message success-style";
                statusBox.style.display = "block";
                
                // Redirect immediato dopo 1 secondo
                setTimeout(() => window.location.href = 'login-user.html', 1000);

            } catch (err) {
                console.error("ERRORE RILEVATO:", err);
                statusBox.innerText = "Errore: " + err.message;
                statusBox.className = "status-message error-style";
                statusBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Registrati";
            }
        });
    </script>
</body>
</html>
