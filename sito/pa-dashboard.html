<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Portale PA</title>
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .pa-header { background-color: #0A0A0A; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); height: 65px; }
        .btn-exit { color: #f44336; background: none; border: 1px solid #f44336; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .area-badge { background-color: rgba(76, 175, 80, 0.15); color: #4CAF50; padding: 6px 12px; border-radius: 6px; font-weight: bold; border: 1px solid #4CAF50; font-size: 14px; }
        
        .main-workspace { flex: 1; display: grid; grid-template-columns: 450px 1fr; height: calc(100vh - 65px); }
        .sidebar-control { background: var(--surface-card); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        
        .card { background: #121212; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        h3 { font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; color: #FFF; }
        
        .mini-fleet-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .mini-vehicle-box { background: #1E1E1E; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13px; }
        .mini-vehicle-box:hover { border-color: #4CAF50; }
        
        .ticket-item { background: #121212; border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .reply-box { margin-top: 10px; display: flex; gap: 8px; }
        .reply-box input { flex: 1; background: #222; border: 1px solid var(--border-color); color: white; padding: 8px; border-radius: 4px; font-size: 13px; outline: none; }
        .btn-reply { background: #4CAF50; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        .map-wrapper { width: 100%; height: 100%; background: #222; position: relative; }
        .map-iframe { width: 100%; height: 100%; border: none; filter: grayscale(1) invert(1) contrast(1.2); }
        .no-data { color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px; }
    </style>
</head>
<body>

    <div class="pa-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-weight: bold; color: #4CAF50; font-size: 18px;">IZALITH</span>
            <span style="color: #888; font-size: 14px;">| Portale Pubblica Amministrazione</span>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span class="area-badge">Comune di: Bari [BA-01]</span>
            <button class="btn-exit" onclick="window.location.replace('index.html')">Sconnetti Ente</button>
        </div>
    </div>

    <div class="main-workspace">
        <div class="sidebar-control">
            
            <div class="card">
                <h3>Veicoli Attivi sul Territorio Comunale</h3>
                <div class="mini-fleet-list" id="lista-mezzi-pa">
                    <p class="no-data">Acquisizione coordinate flotta...</p>
                </div>
            </div>

            <div class="card" style="flex: 1;">
                <h3>Segnalazioni Ambientali / Viabilità Ricevute</h3>
                <div id="contenitore-ticket-pa">
                    <div class="ticket-item">
                        <span style="font-size:11px; color:#4CAF50; font-weight:bold;">AMMINISTRAZIONE: Bari [BA-01]</span>
                        <p style="margin: 5px 0;"><strong>Cittadino:</strong> Presenza di asfalto sconnesso vicino alla corsia ciclabile.</p>
                        <div class="reply-box">
                            <input type="text" placeholder="Scrivi nota di presa in carico..." id="pa1">
                            <button class="btn-reply" onclick="inviaRispostaPA('pa1')">Invia Nota</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="map-wrapper">
            <iframe class="map-iframe" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d48074.88727038753!2d16.835565345719327!3d41.11714264627239!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1347e8f533a1e943%3A0x307d9e262c8e310!2sBari%20BA!5e0!3m2!1sit!2sit!4v1710000000000!5m2!1sit!2sit" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "INSERISCI_QUI_IL_TUO_PROJECT_URL";
        const SUPABASE_KEY = "INSERISCI_QUI_LA_TUA_ANON_PUBLIC_KEY";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ENTE_AREA = "Bari [BA-01]";

        window.onload = function() {
            caricaFlottaPA();
            caricaTicketPA();
        };

        // Estrazione dal database cloud della sola flotta associata al comune d'area
        async function caricaFlottaPA() {
            const container = document.getElementById("lista-mezzi-pa");
            
            const { data: veicoli, error } = await supabase
                .from('veicoli')
                .select('*')
                .eq('area', ENTE_AREA);

            if (error || !veicoli || veicoli.length === 0) {
                container.innerHTML = '<p class="no-data">Nessun mezzo dislocato nella griglia urbana.</p>';
                return;
            }

            container.innerHTML = "";
            veicoli.forEach(mezzo => {
                let div = document.createElement('div');
                div.className = "mini-vehicle-box";
                div.onclick = function() { alert(`Localizzazione sensore IoT veicolo: ${mezzo.codice}`); };
                div.innerHTML = `
                    <span>🚗 Mezzo: ${mezzo.codice}</span>
                    <span style="color:#BBB;">Tipo: ${mezzo.tipo}</span>
                `;
                container.appendChild(div);
            });
        }

        async function caricaTicketPA() {
            const { data: segnalazioni } = await supabase
                .from('segnalazioni')
                .select('*')
                .eq('area', ENTE_AREA)
                .eq('categoria', 'Ambientale / Viabilità');

            if(segnalazioni) {
                const contenitore = document.getElementById("contenitore-ticket-pa");
                segnalazioni.forEach(obj => {
                    let div = document.createElement('div');
                    div.className = "ticket-item";
                    div.innerHTML = `
                        <span style="font-size:11px; color:#ffc107; font-weight:bold;">DISSESTO/SMOG - ${obj.area}</span>
                        <p style="margin: 5px 0;">${obj.descrizione}</p>
                        <div class="reply-box">
                            <input type="text" placeholder="Nota istituzionale..." id="pa_${obj.id}">
                            <button class="btn-reply" onclick="inviaRispostaPA('pa_${obj.id}')">Invia Nota</button>
                        </div>
                    `;
                    contenitore.prepend(div);
                });
            }
        }

        function inviaRispostaPA(idInput) {
            let msg = document.getElementById(idInput).value;
            if(!msg.trim()) return alert("Inserisci un testo.");
            alert("Nota ufficiale archiviata e trasmessa ai sistemi di competenza.");
            document.getElementById(idInput).value = "";
        }
    </script>
</body>
</html>
