<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Portale PA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-blue: #2196F3; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Navbar con Area Utente */
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 65px; }
        .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; }
        .user-profile { display: flex; align-items: center; gap: 15px; color: var(--text-light); }
        .nav-btn-logout { background: #FF5722; border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }

        .workspace { flex: 1; display: grid; grid-template-rows: 1fr 300px; height: calc(100vh - 65px); }
        .top-section { display: grid; grid-template-columns: 340px 1fr; height: 100%; border-bottom: 2px solid var(--border-color); overflow: hidden; }
        
        .sidebar-fleet { background: var(--surface-card); border-right: 1px solid var(--border-color); padding: 20px; overflow-y: auto; }
        .map-wrapper { width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; filter: grayscale(1) invert(1) contrast(1.2); }
        
        .bottom-section { background: var(--surface-card); padding: 20px; overflow-y: auto; }
        .table-container { border: 1px solid var(--border-color); border-radius: 6px; background: #121212; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background: #0A0A0A; color: var(--text-muted); text-transform: uppercase; font-size: 12px; }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-brand">IZALITH - PORTALE PA [BA-01]</div>
        <div class="user-profile">
            <span id="user-email" style="font-size: 13px;"></span>
            <button class="nav-btn-logout" onclick="logout()">Esci</button>
        </div>
    </nav>

    <div class="workspace">
        <div class="top-section">
            <div class="sidebar-fleet">
                <div style="font-weight:bold; margin-bottom:10px;">FLOTTA ATTIVA</div>
                <div id="lista-veicoli-pa"></div>
            </div>
            <div class="map-wrapper">
                <div id="map"></div>
            </div>
        </div>
        <div class="bottom-section">
            <div style="font-weight:bold;">REGISTRO CRITICITÀ</div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Area</th><th>Ambito</th><th>Descrizione</th><th>Data</th></tr></thead>
                    <tbody id="corpo-tabella-pa"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        
        // Inizializzazione Mappa
        const map = L.map('map').setView([41.1171, 16.8719], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        window.onload = function() { 
            supabaseClient.auth.getSession().then(({ data }) => {
                if (!data.session) window.location.href = 'login-user.html';
                else {
                    document.getElementById('user-email').innerText = data.session.user.email;
                    sincronizzaPortalePA();
                }
            });
        };

        async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'login-user.html'; }

        async function sincronizzaPortalePA() {
            const listaDiv = document.getElementById("lista-veicoli-pa");
            const { data: veicoli, error } = await supabaseClient.from('veicoli').select('*').eq('area_competenza', 'BA-01');
            
            listaDiv.innerHTML = "";
            if (!error && veicoli) {
                veicoli.forEach(v => {
                    // Crea lista
                    listaDiv.innerHTML += `<div style="padding:10px; border-bottom:1px solid #333;">${v.nome} (${v.batteria}%)</div>`;
                    // Aggiungi marker mappa
                    if(v.latitudine && v.longitudine) {
                        L.marker([v.latitudine, v.longitudine]).addTo(map).bindPopup(v.nome);
                    }
                });
            }
        }
    </script>
</body>
</html>
