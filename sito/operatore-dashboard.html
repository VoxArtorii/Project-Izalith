<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Izalith - Backoffice Logistica</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #121212; color: white; height: 100vh; display: flex; flex-direction: column; }
        
        /* Navbar */
        .navbar { background: #000; padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 2px solid #FF5722; }
        .title { color: #FF5722; font-weight: bold; }
        
        /* Layout Principale */
        .main-container { display: grid; grid-template-columns: 300px 1fr; flex-grow: 1; overflow: hidden; }
        .sidebar { padding: 20px; background: #1a1a1a; overflow-y: auto; }
        .map-container { position: relative; }
        #map { height: 100%; width: 100%; filter: grayscale(1) invert(1) hue-rotate(180deg); } /* Stile mappa scuro */
        
        /* Tabella */
        .table-container { height: 250px; background: #1a1a1a; border-top: 2px solid #333; overflow-y: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; color: #ccc; }
        th { text-align: left; padding: 10px; border-bottom: 1px solid #444; color: #888; text-transform: uppercase; font-size: 12px; }
        td { padding: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="title">IZALITH - BACKOFFICE LOGISTICA [BA-01]</div>
        <button onclick="logout()">Esci</button>
    </div>

    <div class="main-container">
        <div class="sidebar" id="lista-veicoli">
            <h3>FLOTTA ATTIVA</h3>
            <div id="veicoli-content">Caricamento...</div>
        </div>
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <div class="table-container">
        <h3>REGISTRO CRITICITÀ TECNICHE</h3>
        <table>
            <thead><tr><th>AREA</th><th>AMBITO</th><th>DESCRIZIONE</th><th>DATA</th></tr></thead>
            <tbody id="corpo-tabella"></tbody>
        </table>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const client = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        async function logout() { await client.auth.signOut(); window.location.href = 'login-user.html'; }

        async function init() {
            const map = L.map('map').setView([41.1171, 16.8719], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Carica Veicoli
            const { data: veicoli } = await client.from('veicoli').select('*');
            document.getElementById('veicoli-content').innerHTML = veicoli?.map(v => 
                `<div style="margin-bottom:15px">${v.nome} (${v.batteria}%)</div>`).join('') || "Nessun veicolo";

            // Carica Segnalazioni TECNICHE
            const { data: ticket } = await client.from('segnalazioni').select('*');
            const corpo = document.getElementById("corpo-tabella");
            
            // Filtro per "Tecnica"
            const tecniche = ticket?.filter(t => t.categoria && t.categoria.trim() === "Tecnica");
            
            corpo.innerHTML = tecniche?.map(t => 
                `<tr><td>${t.area}</td><td>${t.categoria}</td><td>${t.descrizione}</td><td>${t.created_at?.split('T')[0]}</td></tr>`
            ).join('') || "<tr><td colspan='4'>Nessuna segnalazione tecnica.</td></tr>";
        }
        window.onload = init;
    </script>
</body>
</html>
