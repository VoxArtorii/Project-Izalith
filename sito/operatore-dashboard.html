<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Izalith - Dashboard Operatore</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #1E1E1E; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Area Operativa: Fleet Management</h1>
        <div id="lista-mezzi">Caricamento mezzi in corso...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");

        async function caricaDatiOperatore() {
            // Supponiamo di filtrare per l'area 'BA-01'
            const { data, error } = await supabaseClient
                .from('mezzi_disponibili')
                .select('*')
                .eq('area_competenza', 'BA-01'); // CORRETTO: area_competenza

            if (error) {
                document.getElementById('lista-mezzi').innerText = "Errore: " + error.message;
            } else {
                document.getElementById('lista-mezzi').innerHTML = JSON.stringify(data, null, 2);
            }
        }
        caricaDatiOperatore();
    </script>
</body>
</html>
