<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Izalith - Operatore Logistica</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --border-color: #2C2C2C; }
        body { background-color: var(--dark-bg); color: var(--text-light); margin: 0; font-family: sans-serif; overflow: hidden; }
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 65px; }
        .workspace { display: grid; grid-template-rows: 1fr 300px; height: calc(100vh - 65px); }
        .top-section { display: grid; grid-template-columns: 340px 1fr; }
        #map { height: 100%; width: 100%; }
        .sidebar-fleet { background: #1E1E1E; padding: 20px; overflow-y: auto; }
        .bottom-section { background: #1E1E1E; padding: 20px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div style="color: #FF5722; font-weight:bold;">IZALITH - BACKOFFICE</div>
        <div id="user-area"><button onclick="logout()">Esci</button></div>
    </nav>

    <div class="workspace">
        <div class="top-section">
            <div class="sidebar-fleet" id="lista-veicoli-operatore">Caricamento flotta...</div>
            <div id="map"></div>
        </div>
        <div class="bottom-section">
            <table><tbody id="corpo-tabella-operatore"></tbody></table>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        
        async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'login-user.html'; }

        async function init() {
            // 1. Mappa
            try {
                const map = L.map('map').setView([41.1171, 16.8719], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            } catch(e) { console.log("Errore Mappa:", e); }

            // 2. Veicoli
            try {
                const { data: veicoli } = await supabaseClient.from('veicoli').select('*').eq('area', 'BA-01');
                document.getElementById("lista-veicoli-operatore").innerHTML = veicoli?.map(v => `<div>${v.nome}</div>`).join('') || "Nessun veicolo";
            } catch(e) { console.log("Errore Veicoli:", e); }

            // 3. Segnalazioni
            try {
                const { data: ticket } = await supabaseClient.from('segnalazioni').select('*');
                const filtrati = ticket?.filter(t => String(t.categoria).toLowerCase().includes('tecnica'));
                document.getElementById("corpo-tabella-operatore").innerHTML = filtrati?.map(t => `<tr><td>${t.descrizione}</td></tr>`).join('') || "Nessuna segnalazione";
            } catch(e) { console.log("Errore Segnalazioni:", e); }
        }

        window.onload = init;
    </script>
</body>
</html>
