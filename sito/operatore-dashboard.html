<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Izalith - Operatore Logistica</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; }
        body { background-color: var(--dark-bg); color: var(--text-light); margin: 0; font-family: sans-serif; }
        
        .app-navbar { background-color: #0A0A0A; padding: 15px 30px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; }
        .workspace { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 70px); }
        .sidebar-fleet { background: var(--surface-card); padding: 20px; overflow-y: auto; border-right: 1px solid #333; }
        #map { width: 100%; height: 100%; }
        .bottom-section { background: var(--surface-card); padding: 20px; border-top: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; }
        td, th { padding: 10px; border-bottom: 1px solid #333; text-align: left; }
        .vehicle-box { background: #121212; padding: 10px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #333; }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div style="color: var(--primary-orange); font-weight: bold;">IZALITH - BACKOFFICE LOGISTICA</div>
        <button onclick="logout()">Esci</button>
    </nav>

    <div class="workspace">
        <div class="sidebar-fleet" id="lista-veicoli">Caricamento veicoli...</div>
        <div id="map"></div>
    </div>
    <div class="bottom-section">
        <table>
            <thead><tr><th>Area</th><th>Categoria</th><th>Descrizione</th></tr></thead>
            <tbody id="corpo-tabella"></tbody>
        </table>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const client = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        async function logout() { await client.auth.signOut(); window.location.href = 'login-user.html'; }

        async function init() {
            // 1. Mappa
            const map = L.map('map').setView([41.1171, 16.8719], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // 2. Veicoli (PROVA A TOGLIERE .eq SE NON VEDI NULLA)
            const { data: veicoli } = await client.from('veicoli').select('*');
            const lista = document.getElementById("lista-veicoli");
            lista.innerHTML = "<strong>Stato Flotta</strong><br><br>";
            
            if(veicoli) {
                veicoli.forEach(v => {
                    lista.innerHTML += `<div class="vehicle-box">${v.nome || 'Veicolo'} - ${v.batteria || 0}%</div>`;
                    if(v.latitudine) L.marker([v.latitudine, v.longitudine]).addTo(map);
                });
            } else {
                lista.innerHTML += "Nessun veicolo trovato.";
            }

            // 3. Segnalazioni
            const { data: segnalazioni } = await client.from('segnalazioni').select('*');
            const corpo = document.getElementById("corpo-tabella");
            if(segnalazioni) {
                corpo.innerHTML = segnalazioni.map(s => `<tr><td>${s.area}</td><td>${s.categoria}</td><td>${s.descrizione}</td></tr>`).join('');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
