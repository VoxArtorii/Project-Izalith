<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Portale Operatore di Logistica</title>
    <style>
        :root {
            --primary-orange: #FF9800;
            --dark-bg: #121212;
            --surface-card: #1E1E1E;
            --text-light: #FFFFFF;
            --text-muted: #A0A0A0;
            --border-color: #2C2C2C;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 65px; }
        .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; font-size: 20px; }
        
        .workspace { flex: 1; display: grid; grid-template-rows: 1fr 300px; height: calc(100vh - 65px); }
        .top-section { display: grid; grid-template-columns: 340px 1fr; height: 100%; border-bottom: 2px solid var(--border-color); overflow: hidden; }
        
        .sidebar-fleet { background: var(--surface-card); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .section-title { font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .vehicle-box { background: #121212; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; transition: border-color 0.3s; }
        .vehicle-box:hover { border-color: var(--primary-orange); }
        .vehicle-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .battery-level { font-weight: bold; font-size: 13px; }
        
        .map-wrapper { width: 100%; height: 100%; background: #222; }
        .map-iframe { width: 100%; height: 100%; border: none; filter: grayscale(1) invert(1) contrast(1.2); }
        
        .bottom-section { background: var(--surface-card); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .table-header-row { display: flex; justify-content: space-between; align-items: center; }
        
        .btn-refresh { background: none; border: 1px solid var(--primary-orange); color: var(--primary-orange); padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .btn-refresh:hover { background: rgba(255,152,0,0.1); }

        .table-container { border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; background: #121212; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background-color: #0A0A0A; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:last-child td { border-bottom: none; }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
        .no-data { text-align: center; color: var(--text-muted); padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-brand" onclick="window.location.reload()">
            <svg width="35" height="35" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5 C15 35 15 75 50 95 C85 75 85 35 50 5 Z" fill="#FF9800"/>
                <polygon points="52,15 35,52 48,52 44,82 65,42 50,42" fill="#FFFFFF"/>
            </svg>
            <span>IZALITH - BACKOFFICE LOGISTICA [BA-01]</span>
        </div>
    </nav>

    <div class="workspace">
        <div class="top-section">
            <div class="sidebar-fleet">
                <div class="section-title">Stato della Flotta</div>
                <p style="color: var(--text-muted); font-size: 12px;">Mezzi assegnati alla squadra logistica BA-01:</p>
                <div id="lista-veicoli-operatore"></div>
            </div>
            
            <div class="map-wrapper">
                <iframe class="map-iframe" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d48074.88727038753!2d16.835565345719327!3d41.11714264627239!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1347e8f533a1e943%3A0x307d9e262c8e310!2sBari%20BA!5e0!3m2!1sit!2sit!4v1710000000000!5m2!1sit!2sit" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
        
        <div class="bottom-section">
            <div class="table-header-row">
                <div>
                    <span class="section-title">Ticket Manutenzione Tecnica</span>
                    <span style="color: var(--text-muted); font-size: 13px; margin-left: 10px;">Interventi urgenti su hardware, batterie e firmware.</span>
                </div>
                <button class="btn-refresh" onclick="sincronizzaPortaleOperatore()">🔄 Aggiorna Logistica</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Area Logistica</th>
                            <th>Categoria</th>
                            <th>Descrizione Segnalazione Hardware/Firmware</th>
                            <th>Data Ricezione</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabella-operatore"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const URL_DB = "https://iqadvwrvmecpetuqpysn.supabase.co";
        const KEY_DB = "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8";
        const supabaseClient = supabase.createClient(URL_DB, KEY_DB);

        const flottaMock = [{ codice: "Auto-L01", tipo: "Auto", nome: "Lithium Model S", batteria: 94, stato: "Disponibile" }];

        window.onload = function() { sincronizzaPortaleOperatore(); };

        function sincronizzaPortaleOperatore() {
            scaricaFlottaOperatore();
            scaricaSegnalazioniTecniche();
        }

        async function scaricaFlottaOperatore() {
            const listaDiv = document.getElementById("lista-veicoli-operatore");
            if(!listaDiv) return;
            listaDiv.innerHTML = '<p class="no-data" style="font-size:12px;">Sincronizzazione telemetria...</p>';

            try {
                // MODIFICA APPLICATA: area_competenza
                const { data: veicoliCloud, error } = await supabaseClient
                    .from('veicoli')
                    .select('*')
                    .eq('area_competenza', 'BA-01');

                let mezzi = (!error && veicoliCloud && veicoliCloud.length > 0) ? veicoliCloud : flottaMock;
                
                listaDiv.innerHTML = "";
                mezzi.forEach(mezzo => {
                    let icona = mezzo.tipo === "Auto" ? "🚗" : (mezzo.tipo === "Scooter" ? "🛵" : "🛴");
                    let coloreBatteria = mezzo.batteria < 30 ? '#f44336' : '#4CAF50';

                    let div = document.createElement('div');
                    div.className = "vehicle-box";
                    div.innerHTML = `
                        <div class="vehicle-meta">
                            <strong>${icona} ${mezzo.nome || mezzo.codice}</strong>
                            <span class="battery-level" style="color: ${coloreBatteria}">${mezzo.batteria}%</span>
                        </div>
                        <p style="color: var(--text-muted); font-size: 12px;">Stato: ${mezzo.stato} | Codice: ${mezzo.codice}</p>
                    `;
                    listaDiv.appendChild(div);
                });
            } catch (e) {
                listaDiv.innerHTML = '<p class="no-data">Errore caricamento flotta.</p>';
            }
        }

        async function scaricaSegnalazioniTecniche() {
            const corpoTabella = document.getElementById("corpo-tabella-operatore");
            if(!corpoTabella) return;
            
            corpoTabella.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Sincronizzazione ticket tecnici...</td></tr>';

            try {
                // MODIFICA APPLICATA: area_competenza
                const { data: ticketTecnici, error } = await supabaseClient
                    .from('segnalazioni')
                    .select('*')
                    .eq('area_competenza', 'BA-01')
                    .eq('categoria', 'Tecnica')
                    .order('id', { ascending: false });

                if (error || !ticketTecnici || ticketTecnici.length === 0) {
                    corpoTabella.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Nessuna anomalia tecnica segnalata.</td></tr>';
                    return;
                }

                corpoTabella.innerHTML = "";
                ticketTecnici.forEach(ticket => {
                    let tr = document.createElement('tr');
                    // MODIFICA APPLICATA: accesso a area_competenza
                    tr.innerHTML = `
                        <td><strong>${ticket.area_competenza}</strong></td>
                        <td><span class="badge" style="background: rgba(244,67,54,0.15); color: #f44336;">${ticket.categoria}</span></td>
                        <td style="color: #E0E0E0;">${ticket.descrizione}</td>
                        <td style="color: var(--text-muted); font-size: 13px;">${ticket.created_at ? new Date(ticket.created_at).toLocaleString('it-IT') : "N/D"}</td>
                    `;
                    corpoTabella.appendChild(tr);
                });
            } catch (err) {
                corpoTabella.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #f44336;">Errore di connessione.</td></tr>';
            }
        }
    </script>
</body>
</html>
