<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Test di Vita</title>
</head>
<body>
    <h1 id="status">Inizio caricamento...</h1>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        console.log("1. Lo script è partito");

        async function test() {
            try {
                console.log("2. Provo a creare il client Supabase");
                const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
                
                console.log("3. Provo a interrogare il database");
                const { data, error } = await supabaseClient.from('veicoli').select('*');
                
                if (error) {
                    document.getElementById("status").innerText = "Errore DB: " + error.message;
                } else {
                    document.getElementById("status").innerText = "Successo! Dati ricevuti: " + data.length;
                    console.log("4. Dati ricevuti:", data);
                }
            } catch (err) {
                document.getElementById("status").innerText = "Errore Critico: " + err.message;
            }
        }

        test();
    </script>
</body>
