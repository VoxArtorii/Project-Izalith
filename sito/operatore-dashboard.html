<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Portale Operatore di Logistica</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 65px; }
        .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; font-size: 20px; color: var(--primary-orange); }
        
        .workspace { flex: 1; display: grid; grid-template-rows: 1fr 300px; height: calc(100vh - 65px); }
        .top-section { display: grid; grid-template-columns: 340px 1fr; height: 100%; border-bottom: 2px solid var(--border-color); overflow: hidden; }
        
        .sidebar-fleet { background: var(--surface-card); border-right: 1px solid var(--border-color); padding: 20px; overflow-y: auto; }
        .map-wrapper { width: 100%; height: 100%; background: #222; }
        #map { width: 100%; height: 100%; filter: grayscale(0.8) invert(1) hue-rotate(180deg) brightness(1.2); }
        
        .bottom-section { background: var(--surface-card); padding: 20px; overflow-y: auto; }
        .vehicle-box { background: #121212; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .custom-orange-marker { background-color: #FF5722; border: 2px solid white; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background: #0A0A0A; color: var(--text-muted); text-transform: uppercase; font-size: 12px; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: rgba(255,87,34,0.15); color: var(--primary-orange); }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-brand">
            <svg width="35" height="35" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5 C15 35 15 75 50 95 C85 75 85 35 50 5 Z" fill="#FF5722"/>
                <polygon points="52,15 35,52 48,52 44,82 65,42 50,42" fill="#FFFFFF"/>
            </svg>
            <span>IZALITH - BACKOFFICE LOGISTICA [BA-01]</span>
        </div>
    </nav>

    <div class="workspace">
        <div class="top-section">
            <div class="sidebar-fleet" id="lista-veicoli-operatore"></div>
            <div class="map-wrapper"><div id="map"></div></div>
        </div>
        <div class="bottom-section">
            <div class="table-container">
                <table>
                    <thead><tr><th>Area</th><th>Categoria</th><th>Descrizione</th><th>Data</th></tr></thead>
                    <tbody id="corpo-tabella-operatore"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        const map = L.map('map').setView([41.1171, 16.8719], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const orangeIcon = L.divIcon({ className: 'custom-orange-marker', iconSize: [20, 20], iconAnchor: [10, 20], popupAnchor: [0, -20] });

        async function sincronizzaPortaleOperatore() {
            // Carica Veicoli
            const { data: veicoli } = await supabaseClient.from('veicoli').select('*').eq('area', 'BA-01');
            const lista = document.getElementById("lista-veicoli-operatore");
            lista.innerHTML = '<div class="section-title">Stato della Flotta</div>';
            
            veicoli?.forEach(v => {
                lista.innerHTML += `
                    <div class="vehicle-box">
                        <strong>${v.nome}</strong><br>
                        <span style="color:${v.batteria < 30 ? '#f44336' : '#4CAF50'}">Batteria: ${v.batteria}%</span>
                    </div>`;
                if(v.latitudine && v.longitudine) {
                    L.marker([v.latitudine, v.longitudine], {icon: orangeIcon}).addTo(map).bindPopup(v.nome);
                }
            });

            // Carica Segnalazioni Tecniche
            const { data: ticket } = await supabaseClient.from('segnalazioni').select('*').eq('area', 'BA-01').eq('categoria', 'Tecnica');
            const corpo = document.getElementById("corpo-tabella-operatore");
            corpo.innerHTML = ticket?.map(t => `
                <tr>
                    <td>${t.area}</td>
                    <td><span class="badge">${t.categoria}</span></td>
                    <td>${t.descrizione}</td>
                    <td>${new Date(t.created_at).toLocaleDateString()}</td>
                </tr>`).join('') || "<tr><td colspan='4'>Nessun ticket tecnico.</td></tr>";
        }

        window.onload = () => {
            setTimeout(() => { map.invalidateSize(); }, 500);
            sincronizzaPortaleOperatore();
        };
    </script>
</body>
</html>
