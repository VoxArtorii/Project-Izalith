<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Console Operatore Flotta</title>
    <style>
        :root {
            --primary-orange: #FF5722;
            --dark-bg: #121212;
            --surface-card: #1E1E1E;
            --text-light: #FFFFFF;
            --text-muted: #A0A0A0;
            --border-color: #2C2C2C;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; min-height: 100vh; }
        
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; font-size: 20px; }
        
        .main-container { flex: 1; padding: 40px; max-width: 1200px; width: 100%; margin: 0 auto; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .panel-title { font-size: 26px; font-weight: 600; }
        
        .btn-refresh { background: none; border: 1px solid var(--primary-orange); color: var(--primary-orange); padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-refresh:hover { background: rgba(255,87,34,0.1); }

        .table-container { background-color: var(--surface-card); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
        th { background-color: #0A0A0A; color: var(--text-muted); font-size: 14px; font-weight: 600; text-transform: uppercase; }
        td { font-size: 15px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: rgba(255,255,255,0.02); }

        .badge { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-tech { background-color: rgba(255,87,34,0.15); color: var(--primary-orange); }
        
        .no-data { text-align: center; color: var(--text-muted); padding: 40px; font-size: 15px; }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-brand" onclick="window.location.reload()">
            <svg width="35" height="35" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5 C15 35 15 75 50 95 C85 75 85 35 50 5 Z" fill="#FF5722"/>
                <polygon points="52,15 35,52 48,52 44,82 65,42 50,42" fill="#FFFFFF"/>
            </svg>
            <span>IZALITH - CONSOLE OPERATORE</span>
        </div>
    </nav>

    <div class="main-container">
        <div class="panel-header">
            <div>
                <h1 class="panel-title">Manutenzione e Guasti Flotta</h1>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 5px;">Visualizzazione esclusiva delle anomalie tecniche (IoT offline, guasti meccanici, batterie scariche).</p>
            </div>
            <button class="btn-refresh" onclick="scaricaSegnalazioniTecniche()">🔄 Aggiorna Ticket</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Area Urbana</th>
                        <th>Categoria</th>
                        <th>Dettaglio Guasto</th>
                        <th>Data Ricezione</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabella-operatore">
                    </tbody>
            </table>
            <div id="messaggio-vuoto" class="no-data" style="display: none;">
                Nessuna anomalia tecnica presente nel database per l'area selezionata.
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const URL_DB = "https://iqadvwrvmecpetuqpysn.supabase.co";
        const KEY_DB = "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8";
        const supabaseClient = supabase.createClient(URL_DB, KEY_DB);

        window.onload = function() {
            scaricaSegnalazioniTecniche();
        };

        async function scaricaSegnalazioniTecniche() {
            const corpoTabella = document.getElementById("corpo-tabella-operatore");
            const messaggioVuoto = document.getElementById("messaggio-vuoto");
            
            corpoTabella.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Recupero anomalie hardware in corso...</td></tr>';
            messaggioVuoto.style.display = "none";

            try {
                // FILTRO COMPLETO: Area = Bari AND Categoria = Tecnica
                const { data: ticketTecnici, error } = await supabaseClient
                    .from('segnalazioni')
                    .select('*')
                    .eq('area', 'Bari [BA-01]')
                    .eq('categoria', 'Tecnica')
                    .order('id', { ascending: false });

                if (error) {
                    console.error("Errore query:", error);
                    corpoTabella.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #f44336;">Errore: ${error.message}</td></tr>`;
                    return;
                }

                if (!ticketTecnici || ticketTecnici.length === 0) {
                    corpoTabella.innerHTML = "";
                    messaggioVuoto.style.display = "block";
                    return;
                }

                corpoTabella.innerHTML = "";
                ticketTecnici.forEach(ticket => {
                    let tr = document.createElement('tr');
                    let dataFormattata = ticket.created_at ? new Date(ticket.created_at).toLocaleString('it-IT') : "N/D";

                    tr.innerHTML = `
                        <td><strong>${ticket.area}</strong></td>
                        <td><span class="badge badge-tech">${ticket.categoria}</span></td>
                        <td style="color: #E0E0E0; max-width: 400px; word-wrap: break-word;">${ticket.descrizione}</td>
                        <td style="color: var(--text-muted); font-size: 13px;">${dataFormattata}</td>
                    `;
                    corpoTabella.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                corpoTabella.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #f44336;">Errore critico di rete.</td></tr>';
            }
        }
    </script>
</body>
</html>
