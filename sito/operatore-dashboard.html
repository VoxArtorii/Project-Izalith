<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Operatore Logistica</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 65px; }
        .nav-brand { color: var(--primary-orange); font-weight: bold; font-size: 18px; }
        .user-area { display: flex; align-items: center; gap: 15px; }
        .btn-logout { background: var(--primary-orange); border: none; color: white; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        
        .workspace { flex: 1; display: grid; grid-template-rows: 1fr 300px; height: calc(100vh - 65px); }
        .top-section { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
        .sidebar-fleet { background: var(--surface-card); padding: 20px; overflow-y: auto; border-right: 1px solid var(--border-color); }
        #map { width: 100%; height: 100%; filter: grayscale(0.8) invert(1) hue-rotate(180deg) brightness(1.2); }
        
        .bottom-section { background: var(--surface-card); padding: 20px; overflow-y: auto; }
        .vehicle-box { background: #121212; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; text-align: left; }
        th { background: #0A0A0A; color: var(--text-muted); text-transform: uppercase; font-size: 12px; }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-brand">IZALITH - BACKOFFICE LOGISTICA [BA-01]</div>
        <div class="user-area">
            <span id="user-email" style="font-size: 13px;"></span>
            <button class="btn-logout" onclick="logout()">Esci</button>
        </div>
    </nav>

    <div class="workspace">
        <div class="top-section">
            <div class="sidebar-fleet" id="lista-veicoli-operatore">Caricamento veicoli...</div>
            <div id="map"></div>
        </div>
        <div class="bottom-section">
            <table>
                <thead><tr><th>Area</th><th>Categoria</th><th>Descrizione</th><th>Data</th></tr></thead>
                <tbody id="corpo-tabella-operatore"><tr><td colspan="4">Caricamento segnalazioni...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Uso un nome variabile diverso per evitare il conflitto con la libreria
        const dbClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        
        async function logout() { await dbClient.auth.signOut(); window.location.href = 'login-user.html'; }

        async function init() {
            // 1. Inizializzazione Mappa
            const map = L.map('map').setView([41.1171, 16.8719], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // 2. Email Utente
            const { data: session } = await dbClient.auth.getSession();
            if (session?.session) document.getElementById('user-email').innerText = session.session.user.email;

            // 3. Carica Veicoli
            const { data: veicoli } = await dbClient.from('veicoli').select('*').eq('area', 'BA-01');
            const lista = document.getElementById("lista-veicoli-operatore");
            lista.innerHTML = "<strong>Stato Flotta</strong><br><br>";
            veicoli?.forEach(v => {
                lista.innerHTML += `<div class="vehicle-box"><strong>${v.nome}</strong><br>Batteria: ${v.batteria}%</div>`;
                if(v.latitudine) L.marker([v.latitudine, v.longitudine]).addTo(map);
            });

            // 4. Carica Segnalazioni con FILTRO PULITO
            const { data: ticket } = await dbClient.from('segnalazioni').select('*');
            const corpo = document.getElementById("corpo-tabella-operatore");
            
            // FILTRO: trasforma tutto in minuscolo, toglie spazi, cerca "tecnica"
            const filtrati = ticket?.filter(t => {
                if (!t.categoria) return false;
                return String(t.categoria).trim().toLowerCase() === "tecnica";
            });
            
            if (filtrati && filtrati.length > 0) {
                corpo.innerHTML = filtrati.map(t => 
                    `<tr><td>${t.area}</td><td>${t.categoria}</td><td>${t.descrizione}</td><td>${new Date(t.created_at).toLocaleDateString()}</td></tr>`
                ).join('');
            } else {
                corpo.innerHTML = "<tr><td colspan='4'>Nessuna segnalazione tecnica trovata.</td></tr>";
            }
        }

        window.onload = init;
    </script>
</body>
</html>
