<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Izalith - Operatore Logistica</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background: #121212; color: #fff; margin: 0; font-family: sans-serif; }
        .workspace { display: flex; flex-direction: column; height: 100vh; }
        #map { height: 50vh; width: 100%; }
        .data-area { padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        td, th { border: 1px solid #444; padding: 10px; }
    </style>
</head>
<body>

    <div class="workspace">
        <div id="map"></div>
        <div class="data-area">
            <div id="lista-veicoli">Flotta: Caricamento...</div>
            <br>
            <table>
                <thead><tr><th>Area</th><th>Categoria</th><th>Descrizione</th></tr></thead>
                <tbody id="corpo-tabella"></tbody>
            </table>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const client = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");

        async function caricaDati() {
            try {
                // 1. Mappa
                const map = L.map('map').setView([41.1171, 16.8719], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

                // 2. Veicoli
                const { data: veicoli } = await client.from('veicoli').select('*');
                document.getElementById('lista-veicoli').innerText = "Veicoli trovati: " + (veicoli ? veicoli.length : 0);

                // 3. Segnalazioni
                const { data: segnalazioni } = await client.from('segnalazioni').select('*');
                const corpo = document.getElementById('corpo-tabella');
                
                if (segnalazioni) {
                    corpo.innerHTML = segnalazioni.map(s => 
                        `<tr><td>${s.area}</td><td>${s.categoria}</td><td>${s.descrizione}</td></tr>`
                    ).join('');
                }
            } catch (err) {
                console.error("ERRORE BLOCCANTE:", err);
            }
        }

        caricaDati();
    </script>
</body>
</html>
