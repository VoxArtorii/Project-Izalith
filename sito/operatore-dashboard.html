<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Console Operatore Flotta</title>
    <style>
        :root {
            --primary-orange: #FF5722;
            --dark-bg: #121212;
            --surface-card: #1E1E1E;
            --text-light: #FFFFFF;
            --text-muted: #A0A0A0;
            --border-color: #2C2C2C;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 65px; }
        .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; font-size: 20px; }
        
        /* Layout Principale Diviso */
        .workspace { flex: 1; display: grid; grid-template-rows: 1fr 300px; height: calc(100vh - 65px); }
        
        /* Sezione Superiore: Flotta + Mappa */
        .top-section { display: grid; grid-template-columns: 340px 1fr; height: 100%; border-bottom: 2px solid var(--border-color); overflow: hidden; }
        
        .sidebar-fleet { background: var(--surface-card); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .section-title { font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .vehicle-box { background: #121212; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 10px; transition: border-color 0.3s; }
        .vehicle-box:hover { border-color: var(--primary-orange); }
        .vehicle-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .battery-level { font-weight: bold; font-size: 13px; }
        
        .map-wrapper { width: 100%; height: 100%; background: #222; }
        .map-iframe { width: 100%; height: 100%; border: none; filter: grayscale(1) invert(1) contrast(1.2); }
        
        /* Sezione Inferiore: Tabella Ticket */
        .bottom-section { background: var(--surface-card); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .table-header-row { display: flex; justify-content: space-between; align-items: center; }
        
        .btn-refresh { background: none; border: 1px solid var(--primary-orange); color: var(--primary-orange); padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .btn-refresh:hover { background: rgba(255,87,34,0.1); }

        .table-container { border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; background: #121212; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background-color: #0A0A0A; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: rgba(255,255,255,0.01); }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge-tech { background-color: rgba(255,87,34,0.15); color: var(--primary-orange); }
        .no-data { text-align: center; color: var(--text-muted); padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-brand" onclick="window.location.reload()">
            <svg width="35" height="35" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5 C15 35 15 75 50 95 C85 75 85 35 50 5 Z" fill="#FF5722"/>
                <polygon points="52,15 35,52 48,52 44,82 65,42 50,42" fill="#FFFFFF"/>
            </svg>
            <span>IZALITH - CONSOLE OPERATORE [BARI]</span>
        </div>
    </nav>

    <div class="workspace">
        
        <div class="top-section">
            <div class="sidebar-fleet">
                <div class="section-title">Stato Flotta Urbana</div>
                <p style="color: var(--text-muted); font-size: 12px;">Mezzi attualmente dislocati a Bari [BA-01]:</p>
                <div id="lista-veicoli-operatore">
