<div id="izalith-app-container" style="background:#f4f6f8; font-family:sans-serif; padding:20px; border-radius:12px; max-width:900px; margin:auto;">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .iz-card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .iz-filter-btn { padding: 8px 18px; border: 1.5px solid #000; border-radius: 20px; cursor: pointer; margin-right: 8px; margin-bottom: 10px; background: #fff; font-weight: 600; font-size: 14px; transition: all 0.2s; }
        .iz-filter-btn:hover { background: #f0f0f0; }
        .iz-filter-btn.active { background: #000; color: #fff; }
        
        #iz-map { height: 450px; width: 100%; border-radius: 8px; border: 1px solid #ddd; margin-top: 15px; }
        
        /* Layout Dettagli Sotto la Mappa */
        .iz-details-flex { display: flex; gap: 30px; flex-wrap: wrap; align-items: center; }
        .iz-img-container { flex: 1; min-width: 250px; text-align: center; }
        .iz-info-container { flex: 2; min-width: 280px; }
        
        .iz-veh-img { max-width: 100%; height: auto; max-height: 220px; object-fit: contain; border-radius: 8px; }
        
        .iz-details-table { width: 100%; font-size: 16px; border-collapse: collapse; margin-top: 15px; }
        .iz-details-table td { padding: 12px 0; border-bottom: 1px solid #eee; }
        .iz-details-table tr:last-child td { border-bottom: none; }
        
        .iz-total-row { display: flex; justify-content: space-between; align-items: center; font-size: 20px; margin: 20px 0; }
        
        .hidden { display: none !important; }
        
        /* Bottoni */
        .iz-btn-group { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .iz-btn { flex: 2; min-width: 200px; padding: 15px; background: #000; color: #fff; border: none; border-radius: 25px; font-weight: 700; font-size: 16px; cursor: pointer; text-align: center; transition: background 0.2s; }
        .iz-btn:hover { background: #333; }
        .iz-btn-outline { flex: 1; min-width: 120px; padding: 15px; background: #fff; color: #000; border: 1.5px solid #000; border-radius: 25px; font-weight: 700; font-size: 16px; cursor: pointer; text-align: center; transition: background 0.2s; }
        .iz-btn-outline:hover { background: #f9f9f9; }
        
        /* Stili per i pin della mappa personalizzati in CSS */
        .leaflet-div-icon { background: transparent; border: none; }
        .custom-pin {
            background-color: #000;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            position: relative;
            top: -36px;
            left: -18px;
        }
        /* Raddrizza l'icona interna per compensare la rotazione del pin */
        .custom-pin i, .custom-pin svg {
            transform: rotate(45deg);
        }
    </style>

    <div class="iz-card">
        <h2 style="margin-top:0; margin-bottom:15px; font-size:24px;">Mappa Veicoli (Taranto)</h2>
        <div>
            <button class="iz-filter-btn active" onclick="filtra('Tutti', this)">Tutti</button>
            <button class="iz-filter-btn" onclick="filtra('Auto', this)">Auto</button>
            <button class="iz-filter-btn" onclick="filtra('Scooter', this)">Scooter</button>
            <button class="iz-filter-btn" onclick="filtra('Monopattino', this)">Monopattino</button>
        </div>
        <div id="iz-map"></div>
    </div>
    
    <div id="iz-details" class="iz-card hidden">
        <h3 style="margin: 0 0 20px 0; font-size: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; display: inline-block;">Dettagli Veicolo</h3>
        
        <div class="iz-details-flex">
            <div class="iz-img-container">
                <img id="iz-v-img" class="iz-veh-img" src="">
            </div>
            
            <div class="iz-info-container">
                <h2 id="iz-v-name" style="margin:0 0 10px 0; font-size: 26px;"></h2>
                <table class="iz-details-table">
                    <tr>
                        <td><strong>ID Mezzo</strong></td>
                        <td id="iz-v-id" style="text-align: right;"></td>
                    </tr>
                    <tr>
                        <td><strong>Batteria</strong></td>
                        <td id="iz-v-soc" style="text-align: right;"></td>
                    </tr>
                    <tr>
                        <td><strong>Distanza</strong></td>
                        <td id="iz-v-dist" style="color:#d32f2f; font-weight:bold; text-align: right;"></td>
                    </tr>
                </table>
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid #eaeaea; margin: 25px 0;">
        
        <div class="iz-checkout">
            <div class="iz-total-row">
                <span>Totale da pagare:</span>
                <strong id="iz-total" style="font-size: 26px;">€ 0,00</strong>
            </div>
            
            <div class="iz-btn-group">
                <button class="iz-btn-outline" onclick="deselect()">Deseleziona</button>
                <button id="iz-confirm" class="iz-btn">Conferma Prenotazione</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const userPos = [40.4715, 17.2450];

        const flotta = [
            { id: 'IZ-01', cat: 'Auto', model: 'Fiat 500e', price: 30.00, soc: '85%', lat: 40.4735, lng: 17.2450, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/2021_Fiat_500e_Icon.jpg/640px-2021_Fiat_500e_Icon.jpg' },
            { id: 'IZ-02', cat: 'Auto', model: 'BMW i3', price: 45.00, soc: '91%', lat: 40.4682, lng: 17.2485, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/BMW_i3_8373.jpg/640px-BMW_i3_8373.jpg' },
            { id: 'IZ-03', cat: 'Scooter', model: 'Vespa Elettrica', price: 20.00, soc: '76%', lat: 40.4705, lng: 17.2340, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Vespa_Elettrica_%2845620986794%29.jpg/640px-Vespa_Elettrica_%2845620986794%29.jpg' },
            { id: 'IZ-04', cat: 'Scooter', model: 'Niu NQi', price: 18.00, soc: '44%', lat: 40.4630, lng: 17.2580, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/NIU_N-Series_-_GIMS_2019_-_0254.jpg/640px-NIU_N-Series_-_GIMS_2019_-_0254.jpg' },
            { id: 'IZ-05', cat: 'Monopattino', model: 'Xiaomi Pro 2', price: 12.00, soc: '98%', lat: 40.4760, lng: 17.2430, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Xiaomi_Mi_Electric_Scooter_Pro_2_1.jpg/640px-Xiaomi_Mi_Electric_Scooter_Pro_2_1.jpg' },
            { id: 'IZ-06', cat: 'Monopattino', model: 'Ninebot Max', price: 14.00, soc: '62%', lat: 40.4718, lng: 17.2510, img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Ninebot_KickScooter_MAX_G30_-_GIMS_2020_-_0290.jpg/640px-Ninebot_KickScooter_MAX_G30_-_GIMS_2020_-_0290.jpg' }
        ];

        let map = L.map('iz-map').setView(userPos, 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: 'OSM' }).addTo(map);

        // Marker posizione utente
        L.marker(userPos, { icon: L.divIcon({ className: '', html: '<i class="fa fa-map-marker" style="color:#d32f2f; font-size:32px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);"></i>' }) }).addTo(map);

        let markers = [];
        let selected = null;

        // Gestione Icone Dinamica
        function getVehicleIcon(cat) {
            let iconHtml = '<i class="fa-solid fa-car" style="font-size:15px;"></i>'; // Default: Auto
            
            if(cat === 'Scooter') {
                iconHtml = '<i class="fa-solid fa-motorcycle" style="font-size:15px;"></i>';
            }
            if(cat === 'Monopattino') {
                // Disegno SVG minimale per il monopattino
                iconHtml = `
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color: white;">
                   <circle cx="5" cy="19" r="2"></circle>
                   <circle cx="19" cy="19" r="2"></circle>
                   <path d="M5 17h14"></path>
                   <path d="M19 17V5h-4"></path>
                </svg>`;
            }

            return L.divIcon({
                className: 'leaflet-div-icon',
                html: `<div class="custom-pin">${iconHtml}</div>`,
                iconSize: [0, 0], 
            });
        }

        function renderMap(cat = 'Tutti') {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            flotta.filter(v => cat === 'Tutti' || v.cat === cat).forEach(v => {
                let m = L.marker([v.lat, v.lng], { icon: getVehicleIcon(v.cat) }).addTo(map).on('click', () => {
                    selected = v;
                    let dist = map.distance(userPos, [v.lat, v.lng]).toFixed(0);
                    
                    const detailsCard = document.getElementById('iz-details');
                    detailsCard.classList.remove('hidden');
                    
                    document.getElementById('iz-v-name').innerText = v.model;
                    document.getElementById('iz-v-img').src = v.img;
                    document.getElementById('iz-v-id').innerText = v.id;
                    document.getElementById('iz-v-soc').innerText = v.soc;
                    document.getElementById('iz-v-dist').innerText = dist + ' metri';
                    
                    // Formattazione del prezzo
                    document.getElementById('iz-total').innerText = '€ ' + v.price.toFixed(2).replace('.', ',');

                    // Scorri automaticamente in basso per mostrare i dettagli (utile su schermi piccoli)
                    detailsCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                markers.push(m);
            });
        }

        function deselect() {
            selected = null;
            document.getElementById('iz-details').classList.add('hidden');
            document.getElementById('iz-total').innerText = '€ 0,00';
            // Riporta la visuale sulla mappa
            document.querySelector('.iz-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function filtra(cat, btn) {
            document.querySelectorAll('.iz-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMap(cat);
            deselect(); // Nasconde la card dettagli se si cambia filtro
        }

        document.getElementById('iz-confirm').onclick = () => {
            if(selected) alert('Prenotazione confermata per: ' + selected.model);
            else alert('Seleziona prima un veicolo sulla mappa!');
        };

        renderMap();
    </script>
</div>
