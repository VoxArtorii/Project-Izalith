<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Portale PA</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --text-muted: #A0A0A0; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .app-navbar { background-color: #0A0A0A; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 65px; }
        .nav-brand { font-weight: bold; font-size: 18px; color: var(--primary-orange); }
        .nav-btn-logout { background: var(--primary-orange); border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        
        .workspace { flex: 1; display: grid; grid-template-rows: 1fr 300px; height: calc(100vh - 65px); }
        .top-section { display: grid; grid-template-columns: 340px 1fr; height: 100%; border-bottom: 2px solid var(--border-color); }
        .sidebar-fleet { background: var(--surface-card); padding: 20px; overflow-y: auto; }
        #map { width: 100%; height: 100%; filter: grayscale(0.8) invert(1) hue-rotate(180deg) brightness(1.2); }
        
        /* Stile Accordion */
        .vehicle-box { background: #222; border: 1px solid #333; margin-bottom: 10px; border-radius: 4px; overflow: hidden; }
        .vehicle-header { padding: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .vehicle-header:hover { background: #333; }
        .vehicle-details { padding: 12px; background: #1a1a1a; border-top: 1px solid #333; display: none; font-size: 0.85em; color: #ccc; }
        
        .bottom-section { background: var(--surface-card); padding: 20px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background: #0A0A0A; color: var(--text-muted); text-transform: uppercase; }
        .custom-orange-marker { background-color: #FF5722; border: 2px solid white; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
    </style>
</head>
<body>

    <nav class="app-navbar">
        <div class="nav-brand">IZALITH - PORTALE PA [BA-01]</div>
        <button class="nav-btn-logout" onclick="logoutUser()">Esci</button>
    </nav>

    <div class="workspace">
        <div class="top-section">
            <div class="sidebar-fleet">
                <div style="font-weight:bold; margin-bottom:10px;">FLOTTA ATTIVA</div>
                <div id="lista-mezzi"></div>
            </div>
            <div id="map"></div>
        </div>
        <div class="bottom-section">
            <div style="font-weight:bold; margin-bottom:10px;">REGISTRO CRITICITÀ (NON TECNICHE)</div>
            <table>
                <thead><tr><th>Area</th><th>Ambito</th><th>Descrizione</th><th>Data</th></tr></thead>
                <tbody id="tabella-criticità"></tbody>
            </table>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = supabase.createClient("https://iqadvwrvmecpetuqpysn.supabase.co", "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8");
        const map = L.map('map').setView([41.1171, 16.8719], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const orangeIcon = L.divIcon({ className: 'custom-orange-marker', iconSize: [20, 20], iconAnchor: [10, 20], popupAnchor: [0, -20] });

        function toggleDetails(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === "block" ? "none" : "block";
        }

        async function logoutUser() { await supabaseClient.auth.signOut(); window.location.href = 'login-user.html'; }

        async function caricaDatiAggiornati() {
            const { data: veicoli } = await supabaseClient
                .from('veicoli')
                .select('*, noleggi(utente_id, utenti(nome, email))')
                .eq('area', 'BA-01');

            const lista = document.getElementById("lista-mezzi");
            lista.innerHTML = "";
            
            veicoli?.forEach((v, index) => {
                const noleggio = v.noleggi?.find(n => v.stato === 'In uso');
                const infoUtente = noleggio ? `<strong>Utente:</strong> ${noleggio.utenti?.nome || 'N/D'} (${noleggio.utenti?.email || 'N/D'})` : '<em>Veicolo libero</em>';

                lista.innerHTML += `
                    <div class="vehicle-box">
                        <div class="vehicle-header" onclick="toggleDetails('details-${index}')">
                            ${v.nome} (${v.batteria}%) <span>▼</span>
                        </div>
                        <div class="vehicle-details" id="details-${index}">
                            <b>Stato:</b> ${v.stato}<br>
                            ${infoUtente}<br>
                            <b>Lat:</b> ${v.latitudine}<br>
                            <b>Lon:</b> ${v.longitudine}
                        </div>
                    </div>`;

                if(v.latitudine && v.longitudine) {
                    L.marker([v.latitudine, v.longitudine], {icon: orangeIcon}).addTo(map).bindPopup(v.nome);
                }
            });

            const { data: segn } = await supabaseClient
                .from('segnalazioni')
                .select('*')
                .eq('area', 'BA-01')
                .neq('categoria', 'Tecnica');

            const tab = document.getElementById("tabella-criticità");
            tab.innerHTML = segn?.map(s => `<tr><td>${s.area}</td><td>${s.categoria}</td><td>${s.descrizione}</td><td>${new Date(s.created_at).toLocaleDateString()}</td></tr>`).join('') || "<tr><td colspan='4'>Nessuna segnalazione rilevata.</td></tr>";
        }

        window.onload = () => {
            supabaseClient.auth.getSession().then(({ data }) => {
                if (!data.session) window.location.href = 'login-user.html';
                else {
                    setTimeout(() => { map.invalidateSize(); }, 500);
                    caricaDatiAggiornati();
                }
            });
        };
    </script>
</body>
</html>
