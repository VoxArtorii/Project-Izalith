<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izalith - Login Utente</title>
    <style>
        :root { --primary-orange: #FF5722; --dark-bg: #121212; --surface-card: #1E1E1E; --text-light: #FFFFFF; --border-color: #2C2C2C; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; flex-direction: column; min-height: 100vh; }
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: var(--surface-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo-center { text-align: center; margin-bottom: 20px; cursor: pointer; }
        h2 { text-align: center; margin-bottom: 25px; font-weight: 600; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .form-group label { font-size: 13px; color: #BBB; }
        .form-group input { background: #121212; border: 1px solid var(--border-color); padding: 12px; border-radius: 6px; color: white; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: var(--primary-orange); }
        .btn-submit { width: 100%; background: var(--primary-orange); color: white; border: none; padding: 14px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 15px; }
        .btn-submit:hover { background-color: #E64A19; }
        .btn-secondary-link { background: none; border: none; color: var(--primary-orange); cursor: pointer; font-size: 14px; text-decoration: none; display: block; margin: 10px auto; }
        
        /* Box per messaggi di errore */
        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo-center" onclick="window.location.replace('index.html')">
                <svg width="50" height="50" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5 C15 35 15 75 50 95 C85 75 85 35 50 5 Z" fill="#FF5722"/>
                    <polygon points="52,15 35,52 48,52 44,82 65,42 50,42" fill="#FFFFFF"/>
                </svg>
            </div>
            <h2>Accedi all'Eco-Sharing</h2>
            
            <div id="error-box" class="error-message"></div>
            
            <form onsubmit="return entra(event)">
                <div class="form-group">
                    <label>Indirizzo Email</label>
                    <input type="email" id="email-field" required placeholder="Inserisci la tua email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password-field" required placeholder="••••••••">
                </div>
                <button type="submit" id="submit-btn" class="btn-submit">Accedi</button>
            </form>

            <button class="btn-secondary-link" onclick="window.location.replace('registrazione.html')">Nuovo utente? Crea un account</button>
            <button class="btn-secondary-link" style="color: #888;" onclick="window.location.replace('index.html')">← Torna alla Home generale</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configurazione delle credenziali del Cloud Database di Project Izalith
        const URL_DB = "https://iqadvwrvmecpetuqpysn.supabase.co";
        const KEY_DB = "sb_publishable_VPxs6vLRl274cgZnVDi8PA_ncIulKe8";
        const supabaseClient = supabase.createClient(URL_DB, KEY_DB);

        async function entra(e) { 
            e.preventDefault(); 
            
            const email = document.getElementById("email-field").value.trim();
            const password = document.getElementById("password-field").value;
            const errorBox = document.getElementById("error-box");
            const submitBtn = document.getElementById("submit-btn");

            // Reset stato grafico precedente
            errorBox.style.display = "none";
            errorBox.innerText = "";
            submitBtn.innerText = "Verifica credenziali...";
            submitBtn.disabled = true;

            try {
                // Chiamata asincrona al servizio nativo Supabase Auth
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    // Gestione degli errori di credenziali errate o inesistenti
                    errorBox.innerText = "Accesso negato: " + traduciErrore(error.message);
                    errorBox.style.display = "block";
                    submitBtn.innerText = "Accedi";
                    submitBtn.disabled = false;
                    return false;
                }

                // Autenticazione riuscita, reindirizzamento alla dashboard principale dell'utente
                window.location.replace('dashboard.html');

            } catch (err) {
                errorBox.innerText = "Errore di connessione con il server di autenticazione.";
                errorBox.style.display = "block";
                submitBtn.innerText = "Accedi";
                submitBtn.disabled = false;
            }

            return false;
        }

        // Funzione ausiliaria per mostrare all'utente errori chiari in italiano
        function traduciErrore(msg) {
            if (msg.includes("Invalid login credentials")) {
                return "Email o password errate.";
            }
            if (msg.includes("Email not confirmed")) {
                return "L'indirizzo email non è ancora stato confermato.";
            }
            return msg;
        }
    </script>
</body>
</html>
